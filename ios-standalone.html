/* ── inlined: wds-tokens.css ── */
/* ═══════════════════════════════════════════════════════════════════
   WIRE DESIGN SYSTEM 2.0 — SHARED TOKEN LAYER
   Source of truth: Wire Design System Figma (grkG8ylzSzIM0C1Nnaxn3l)
   Consumed by: prototype.html (desktop), android.html, ios.html
   Contract:  <html data-theme="light|dark" data-accent="blue|petrol|purple|amber|green|red|ink">
              wallpaper element: id="page" class="bg-mood-<mood>"
   ═══════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════
   WIRE DESIGN SYSTEM — CSS TOKENS
   Source: Wire Design System Figma (grkG8ylzSzIM0C1Nnaxn3l)
   Auto-resolved from Figma variable collections.
   Token naming: Figma path → CSS var (slashes → hyphens, lowercase)
   ═══════════════════════════════════════════════════════════════════ */

:root {

  /* ── IDENTITY TINTS — fixed avatar colors (not accent-dependent) ── */
  --wire-identity-blue:   #0667c8;  /* Light/Accent color/500 Blue   */
  --wire-identity-green:  #1d7833;  /* Light/Accent color/500 Green  */
  --wire-identity-amber:  #a25915;  /* Light/Accent color/500 Amber  */
  --wire-identity-petrol: #01718e;  /* Light/Accent color/500 Petrol */
  --wire-identity-purple: #8944ab;  /* Light/Accent color/500 Purple */
  --wire-identity-red:    #c20013;  /* Light/Accent color/500 Red    */

  /* Background mood — companion hues per accent (resolve through identity tokens, so they stay theme-correct) */
  --bg-hue: var(--wire-identity-blue);
  --bg-h2:  var(--wire-identity-petrol);
  --bg-h3:  var(--wire-identity-purple);
  --bg-h4:  var(--wire-identity-green);
  /* Fade-to base for the wallpaper: a soft, faintly accent-tinted off-white in light
     (never pure white); overridden to the deep base in dark mode below. */
  --bg-base: color-mix(in srgb, var(--bg-hue) 7%, var(--wire-bg-base-tertiary));

  /* ── CHANNEL AVATAR FILLS ── */
  --wire-channel-blue-bg:     #e7f0fa; --wire-channel-blue-border:   #cde1f4;
  --wire-channel-green-bg:    #e8f1ea; --wire-channel-green-border:  #d2e4d6;
  --wire-channel-amber-bg:    #f6eee8; --wire-channel-amber-border:  #ecded0;
  --wire-channel-petrol-bg:   #e5f1f3; --wire-channel-petrol-border: #cce2e7;
  --wire-channel-purple-bg:   #f4edf7; --wire-channel-purple-border: #e7daee;
  --wire-channel-red-bg:      #f9e6e8; --wire-channel-red-border:    #f3ccd0;
  /* ── SPACING (platform-independent) ─────────────────────────── */
  --spacing-0:  0px;
  --spacing-1:  4px;
  --spacing-2:  8px;
  --spacing-3:  12px;
  --spacing-4:  16px;
  --spacing-5:  20px;
  --spacing-6:  24px;
  --spacing-8:  32px;
  --spacing-10: 40px;
  --spacing-12: 48px;
  --spacing-16: 64px;
  --spacing-20: 80px;
  --spacing-24: 96px;

  /* ── RADIUS ──────────────────────────────────────────────────── */
  --radius-none: 0px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   10px;
  --radius-base: 12px;
  --radius-xl:   17px;
  --radius-2xl:  22px;
  --radius-full: 9999px;

  /* ── TYPOGRAPHY / INTER (WDS additions) ─────────────────────── */
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-weight-light:    300;
  --font-weight-regular:  400;
  --font-weight-medium:   500;
  --font-weight-semibold: 600;
  --font-weight-bold:     700;
  --font-size-xs:   12px;
  --font-size-sm:   13px;
  --font-size-base: 14px;
  --font-size-md:   16px;
  --font-size-lg:   18px;
  --font-size-xl:   20px;
  --line-height-xs:   16px;
  --line-height-sm:   18px;
  --line-height-base: 20px;
  --line-height-md:   24px;

  /* ── THEME TOKENS — LIGHT MODE (default) ─────────────────────
     CSS var naming: --wire-{group}-{subgroup}-{variant}
     Maps 1:1 to Figma Theme collection token names.
     ───────────────────────────────────────────────────────────── */

  /* Background / Base */
  --wire-bg-base-primary:           #ffffff;
  --wire-bg-base-primary-focus:     #fafafa;
  --wire-bg-base-secondary:         #fafafa;
  --wire-bg-base-secondary-focus:   #e5e8ea;
  --wire-bg-base-tertiary:          #edeff0;
  --wire-bg-base-tertiary-focus:    #dce0e3;

  /* Background / Accent Color — Blue (default, overridden by data-accent) */
  --wire-bg-accent-primary:         #0667c8;
  --wire-bg-accent-primary-focus:   #043e78;
  --wire-bg-accent-secondary:       #e7f0fa;
  --wire-bg-accent-secondary-focus: #cde1f4;

  /* Background / Danger */
  --wire-bg-danger-primary:         #c20013;
  --wire-bg-danger-primary-focus:   #74000b;
  --wire-bg-danger-secondary:       #f9e6e8;
  --wire-bg-danger-secondary-focus: #f3ccd0;

  /* Background / Warning */
  --wire-bg-warning-primary:        #a25915;
  --wire-bg-warning-primary-focus:  #61350d;
  --wire-bg-warning-secondary:      #f6eee8;

  /* Background / Positive */
  --wire-bg-positive-primary:       #1d7833;
  --wire-bg-positive-primary-focus: #11481f;
  --wire-bg-positive-secondary:     #e8f1ea;

  /* Background / Neutral */
  --wire-bg-neutral-primary:        #dce0e3;
  --wire-bg-neutral-secondary:      #ffffff;

  /* Background / Disabled */
  --wire-bg-disabled-primary:       #cbced1;
  --wire-bg-disabled-secondary:     #edeff0;

  /* Background / Inverted */
  --wire-bg-inverted-primary:       #17181a;
  --wire-bg-inverted-primary-focus: #54585f;
  --wire-bg-inverted-secondary:     #17181a;

  /* Background / Backdrop */
  --wire-bg-backdrop:               rgba(0,0,0,0.55);

  /* Background / Sheet */
  --wire-bg-sheet-primary:          #edeff0;
  --wire-bg-sheet-secondary:        #ffffff;

  /* Background / Bubbles */
  --wire-bg-bubbles-own-primary:        #0667c8;
  --wire-bg-bubbles-own-primary-focus:  #043e78;
  --wire-bg-bubbles-own-secondary:      #0552a0;
  --wire-bg-bubbles-others-primary:         #edeff0;  /* Gray/020 */
  --wire-bg-bubbles-others-primary-focus:   #dce0e3;  /* Gray/040 */
  --wire-bg-bubbles-others-secondary:       #ffffff;  /* White/100 */
  --wire-bg-bubbles-others-secondary-focus: #fafafa;  /* Gray/010 */

  /* Content / Base */
  --wire-content-base-primary:      #000000;
  --wire-content-base-secondary:    #676b71;

  /* Content / Accent Color */
  --wire-content-accent-primary:    #0667c8;
  --wire-content-accent-on-primary: #ffffff;
  --wire-content-accent-on-secondary: #0667c8;

  /* Content / Danger */
  --wire-content-danger-primary:    #c20013;
  --wire-content-danger-on-primary: #ffffff;
  --wire-content-danger-on-secondary: #c20013;

  /* Content / Warning */
  --wire-content-warning-primary:   #a25915;
  --wire-content-warning-on-primary: #ffffff;

  /* Content / Positive */
  --wire-content-positive-primary:  #1d7833;
  --wire-content-positive-on-primary: #ffffff;

  /* Content / Neutral */
  --wire-content-neutral-on-primary:   #17181a;
  --wire-content-neutral-on-secondary: #17181a;

  /* Content / Disabled */
  --wire-content-disabled-primary:    #676b71;
  --wire-content-disabled-on-primary: #54585f;

  /* Content / Inverted */
  --wire-content-inverted-on-primary: #ffffff;

  /* Content / Bubbles */
  --wire-content-bubbles-own-primary:     #ffffff;
  --wire-content-bubbles-own-on-primary:  #cde1f4;
  --wire-content-bubbles-own-on-secondary:#9bc2e9;

  /* Border / Base */
  --wire-border-base-primary:         #dce0e3;
  --wire-border-base-secondary:       #ffffff;
  --wire-border-base-focus:           #6aa4de;

  /* Border / Accent Color */
  --wire-border-accent-primary:       #0667c8;
  --wire-border-accent-secondary:     #cde1f4;
  --wire-border-accent-focus:         #6aa4de;

  /* Border / Danger */
  --wire-border-danger-primary:       #c20013;
  --wire-border-danger-secondary:     #f3ccd0;
  --wire-border-danger-focus:         #da6671;

  /* Border / Warning */
  --wire-border-warning-primary:      #a25915;

  /* Border / Positive */
  --wire-border-positive-primary:     #1d7833;

  /* Border / Neutral */
  --wire-border-neutral-primary:      #676b71;
  --wire-border-neutral-secondary:    #dce0e3;

  /* Border / Disabled */
  --wire-border-disabled-primary:     #dce0e3;

  /* Border / Inverted */
  --wire-border-inverted-primary:     #ffffff;

  /* ── ACCENT COLOR RAMPS — Blue (default) ────────────────────── */
  --wire-accent-050: #e7f0fa;
  --wire-accent-100: #cde1f4;
  --wire-accent-200: #9bc2e9;
  --wire-accent-300: #6aa4de;
  --wire-accent-400: #3885d3;
  --wire-accent-500: #0667c8;
  --wire-accent-600: #0552a0;
  --wire-accent-700: #043e78;
  --wire-accent-800: #022950;
  --wire-accent-900: #021f3c;

  /* Plain Colors — imported from Wire Design System (Theme collection) · light */
  --wire-plain-purple-primary:#8944ab; --wire-plain-purple-primary-focus:#6e3689; --wire-plain-purple-secondary:#f4edf7; --wire-plain-purple-secondary-focus:#e7daee;
  --wire-plain-blue-primary:#0667c8;   --wire-plain-blue-primary-focus:#0552a0;   --wire-plain-blue-secondary:#e7f0fa;   --wire-plain-blue-secondary-focus:#cde1f4;
  --wire-plain-amber-primary:#a25915;  --wire-plain-amber-primary-focus:#824711;  --wire-plain-amber-secondary:#f6eee8;  --wire-plain-amber-secondary-focus:#ecded0;
  --wire-plain-green-primary:#1d7833;  --wire-plain-green-primary-focus:#176029;  --wire-plain-green-secondary:#e8f1ea;  --wire-plain-green-secondary-focus:#d2e4d6;
  --wire-plain-red-primary:#c20013;    --wire-plain-red-primary-focus:#9b000f;    --wire-plain-red-secondary:#f9e6e8;    --wire-plain-red-secondary-focus:#f3ccd0;
  --wire-plain-petrol-primary:#01718e; --wire-plain-petrol-primary-focus:#015a6e; --wire-plain-petrol-secondary:#e5f1f3; --wire-plain-petrol-secondary-focus:#cce2e7;
  --wire-plain-gray-primary:#54585f;   --wire-plain-gray-primary-focus:#34373d;   --wire-plain-gray-secondary:#e5e8ea;   --wire-plain-gray-secondary-focus:#dce0e3;
}

/* ── Background moods ─────────────────────────────────────────────────

   seen in the outer frame: the top band (where the global search floats) and
   the left column (where the nav rail sits). These #page rules therefore
   concentrate colour along the top and left edges — richest at the top-left
   corner — and fade into the covered centre. Hue comes from the current accent
   (--bg-hue/-h2/-h3/-h4, theme-correct); lightness mixes toward --bg-base

}
.sb-time {
  flex: 1; text-align: center;
  font-size: 17px; line-height: 22px; font-weight: 600;
  letter-spacing: -0.408px;
  padding-left: 6px;
}
.sb-notch {
  width: 172px; height: 32px; flex-shrink: 0;
  background: #000;
  border-radius: 0 0 20px 20px;
}
.sb-right { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sb-right svg { display: block; }
.sb-batt {
  width: 25px; height: 13px; border-radius: 4px;
  border: 1px solid currentColor; opacity: .9;
  position: relative; display: block;
}
.sb-batt::before {
  content: ""; position: absolute; inset: 2px; width: 17px;
  background: currentColor; border-radius: 2px;
}
.sb-batt::after {
  content: ""; position: absolute; right: -3px; top: 4px;
  width: 1.5px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0;
}

/* ─── TOOLBAR ──────────────────────────────────────────────────────
   SwiftUI: .toolbar { ToolbarItem(.topBarLeading/.principal/.topBarTrailing) } */
.toolbar {
  flex-shrink: 0; position: relative; z-index: 3;
  min-height: 54px;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 0 16px 10px;
}
.tb-title {
  position: absolute; left: 50%; top: 13px; transform: translateX(-50%);
  font-size: 17px; line-height: 22px; font-weight: 600;
  letter-spacing: -0.43px; white-space: nowrap;
  color: var(--chrome-fg);
}
.tb-avatar {
  width: 44px; height: 44px; position: relative; flex-shrink: 0;
  border-radius: 100px;
}
.tb-avatar .av { width: 44px; height: 44px; border-radius: 100px;
  border: 1px solid var(--wire-border-base-primary); }
.tb-presence {
  position: absolute; right: 1px; bottom: 1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--wire-bg-positive-primary);
  border: 2px solid var(--wire-bg-base-primary);
}

/* Trailing pair: glass "more", then the prominent new-conversation
   action. Separate surfaces, not one capsule. */
.tb-trailing { display: flex; align-items: center; gap: 8px; }

/* Prominent action — filled with the selected accent. */
.tb-action {
  width: 44px; height: 44px; flex-shrink: 0;
  border: 0; padding: 0; border-radius: 100px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  /* Tinted glass: accent beneath a soft specular wash. */
  background:
    linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0) 58%),
    var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
  box-shadow:
    var(--ios-glass-shadow),
    inset 0 0 0 0.5px rgba(0,0,0,0.08),
    inset 0 0.5px 0 rgba(255,255,255,0.35);
}
.tb-action:active { opacity: .7; }
.tb-action:focus { outline: none; }
.tb-action:focus-visible { outline: 2px solid var(--wire-border-accent-primary); outline-offset: 2px; }

/* Glass capsule button group — iOS 26 toolbar material */
.glass-group {
  height: 44px; display: flex; align-items: center; gap: 20px;
  padding: 0 4px; border-radius: 296px;
  background: var(--ios-glass-fill);
  -webkit-backdrop-filter: var(--ios-glass-blur);
  backdrop-filter: var(--ios-glass-blur);
  box-shadow: var(--ios-glass-lift);
}
.glass-btn {
  width: 36px; height: 36px; border: 0; padding: 0; background: none;
  border-radius: 100px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-base-primary);
}
.glass-btn:active { opacity: .5; }
.glass-btn:focus { outline: none; }
.glass-btn:focus-visible { outline: 2px solid var(--wire-border-accent-primary); outline-offset: 2px; }
/* The capsule does not sit above the menu — it becomes it. */
.glass-group {
  transition: opacity .14s linear, transform .28s cubic-bezier(.32,.72,0,1);
}
.glass-group[data-absorbed="true"] {
  opacity: 0; pointer-events: none; transform: scale(.96);
}

/* ─── FILTER CHIP ROW ──────────────────────────────────────────────
   SwiftUI: ScrollView(.horizontal) of Capsule buttons */
.filter-bar {
  flex-shrink: 0; display: flex; gap: 8px;
  padding: 8px 16px;
  background: var(--wire-bg-base-primary);
}
.filter-pill {
  height: 28px; padding: 4px 10px; border-radius: 1000px;
  border: 1px solid transparent;
  background: var(--wire-bg-base-tertiary);
  color: var(--wire-content-base-primary);
  font: inherit; font-size: 15px; font-weight: 400; line-height: 20px;
  cursor: pointer; white-space: nowrap;
}
.filter-pill[aria-pressed="true"] {
  background: var(--wire-bg-base-primary);
  border-color: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-primary);
  font-weight: 700;
}
.filter-pill:active { opacity: .6; }

/* ─── CONVERSATION LIST CARD ───────────────────────────────────────
   The app surface sits on top of the wallpaper and is opaque.
   SwiftUI: List(.plain) inside a rounded container */
.list-scroll {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
.list-scroll::-webkit-scrollbar { display: none; }
.conv-card {
  background: var(--wire-bg-base-primary);
  padding-bottom: 110px;
  display: flex; flex-direction: column;
  min-height: 100%;
}

/* ─── CONVERSATION ROW ─────────────────────────────────────────────
   Kalium "Grouped Row" — 60pt, avatar 44, hairline inset to the text */
.conv-row {
  display: flex; align-items: center; width: 100%; min-height: 60px;
  background: var(--wire-bg-base-primary);
  border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer;
  overflow: hidden;
}
.conv-row:active { background: var(--wire-bg-base-primary-focus); }
.cr-inner { flex: 1; min-width: 0; height: 60px; display: flex; align-items: center;
  gap: 4px; padding-left: 16px; }
.cr-avatar { height: 60px; display: flex; align-items: center; padding-right: 8px; flex-shrink: 0; }
.cr-body {
  flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 8px;
  border-bottom: 0.5px solid var(--wire-border-base-primary);
}
.conv-row:last-child .cr-body { border-bottom: 0; }
.conv-row:has(+ .sec-header) .cr-body { border-bottom: 0; }
.cr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.cr-title {
  font-size: 16px; line-height: 21px; font-weight: 600; letter-spacing: -0.31px;
  color: var(--wire-content-base-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cr-detail {
  font-size: 15px; line-height: 20px; font-weight: 400; letter-spacing: -0.23px;
  color: var(--wire-content-base-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cr-trail { flex-shrink: 0; height: 100%; display: flex; align-items: center;
  justify-content: flex-end; padding-right: 16px; }

/* Avatars ------------------------------------------------------- */
.av-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
.tb-av {                      /* own avatar — carries the selected accent */
  width: 44px; height: 44px; border-radius: 100px;
  border: 1.286px solid var(--wire-border-base-primary);
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
  font-size: 16px; font-weight: 600; letter-spacing: .2px;
  background-size: cover; background-position: center;
}
.av-group {                                   /* 44pt, r 12.571, 1px border */
  width: 44px; height: 44px; border-radius: 12.571px;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.av-group .wds-ic { width: 29.8px !important; height: 13.93px !important; }
.av-channel {                                 /* 44pt, r 12.571 — Plain Colors */
  width: 44px; height: 44px; border-radius: 12.571px;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-plain-blue-secondary);
  border: 1px solid var(--wire-plain-blue-secondary-focus);
  color: var(--wire-plain-blue-primary);
}
.av-channel[data-color="purple"] { background: var(--wire-plain-purple-secondary); border-color: var(--wire-plain-purple-secondary-focus); color: var(--wire-plain-purple-primary); }
.av-channel[data-color="red"]    { background: var(--wire-plain-red-secondary);    border-color: var(--wire-plain-red-secondary-focus);    color: var(--wire-plain-red-primary); }
.av-channel[data-color="green"]  { background: var(--wire-plain-green-secondary);  border-color: var(--wire-plain-green-secondary-focus);  color: var(--wire-plain-green-primary); }
.av-channel[data-color="amber"]  { background: var(--wire-plain-amber-secondary);  border-color: var(--wire-plain-amber-secondary-focus);  color: var(--wire-plain-amber-primary); }
.av-channel[data-color="petrol"] { background: var(--wire-plain-petrol-secondary); border-color: var(--wire-plain-petrol-secondary-focus); color: var(--wire-plain-petrol-primary); }
.av-channel[data-color="gray"]   { background: var(--wire-plain-gray-secondary);   border-color: var(--wire-plain-gray-secondary-focus);   color: var(--wire-plain-gray-primary); }
.av-badge {                                   /* "Closed" lock — r 4.714, inset -5.5 */
  position: absolute; right: -5.5px; bottom: -5.5px;
  display: flex; align-items: center; justify-content: center; padding: 3px;
  border-radius: 4.714px;
  background: var(--wire-content-base-primary);
  color: var(--wire-content-inverted-on-primary);
}

/* Trailing accessories ------------------------------------------ */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; overflow: hidden;
}
.badge-count {
  background: var(--wire-bg-inverted-primary);
  color: var(--wire-content-inverted-on-primary);
  padding: 1px 8px;
  font-size: 12px; line-height: 16px; font-weight: 600;
}
.badge-mention {
  background: var(--wire-bg-inverted-primary);
  color: var(--wire-content-inverted-on-primary);
  padding: 3px 6px;
}
.badge-mute {
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-secondary);
  padding: 3px 6px;
}

/* ─── SCREENS ──────────────────────────────────────────────────────
   One status bar; toolbar and content swap per destination. */
#page[data-dest="conversations"] [data-screen="settings"],
#page[data-dest="conversations"] [data-screen="conversation"],
#page[data-dest="settings"] [data-screen="conversations"],
#page[data-dest="settings"] [data-screen="conversation"],
#page[data-dest="conversation"] [data-screen="conversations"],
#page[data-dest="conversation"] [data-screen="settings"] { display: none; }
#page[data-dest="settings"],
#page[data-dest="conversation"] { --chrome-fg: var(--wire-content-base-primary); }
/* The tab bar belongs to the list, not to a conversation. */
#page[data-dest="conversation"] .tab-wrap { display: none; }

/* Settings sits on its own grouped-sheet background rather than the
   wallpaper: sheet/primary behind, sheet/secondary for the cards. */
.set-backdrop {
  position: absolute; inset: 0; z-index: 0;
  background: var(--wire-bg-sheet-primary);
}

/* ─── SETTINGS — native inset grouped list ─────────────────────────
   Spec: Kalium 327:54288. Cards 358 wide (16pt inset), radius 26,
   rows 52 with a 48pt symbol column and a separator inset past it. */
.set-scroll {
  position: absolute; inset: 0; z-index: 1;
  overflow-y: auto; overflow-x: hidden;
  padding: 107px 16px 118px;
  scrollbar-width: none;
}

/* Top scroll-edge effect — same construction as the one behind the
   tab bar, mirrored. Kalium "Scroll Edge Effect - Soft" is 123 tall. */
.set-top-edge {
  position: absolute; left: 0; right: 0; top: 0; height: 123px;
  z-index: 2; pointer-events: none;
  -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px);
  -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 58%, transparent 100%);
  background: linear-gradient(to bottom, var(--ios-edge-fill), transparent 96%);
}
.set-scroll::-webkit-scrollbar { display: none; }
.set-head, .set-foot {
  padding: 8px 16px 6px;
  font-size: 13px; line-height: 16px; letter-spacing: -0.08px;
  color: var(--wire-content-base-secondary);
}
.set-head { padding-top: 16px; }
.set-card {
  background: var(--wire-bg-sheet-secondary);
  border-radius: 26px; overflow: hidden;
  display: flex; flex-direction: column;
}
.set-row {
  display: flex; align-items: center; width: 100%; height: 52px;
  padding: 0 16px; border: 0; background: none; font: inherit;
  text-align: left; color: var(--wire-content-base-primary);
}
.set-row[role="button"] { cursor: pointer; }
.set-row[role="button"]:active { background: var(--wire-bg-base-primary-focus); }
.set-row:focus { outline: none; }
.set-row:focus-visible { outline: 2px solid var(--wire-border-accent-primary); outline-offset: -2px; }
.set-sym {
  width: 48px; padding-right: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-accent-primary);
}
.set-contents {
  flex: 1; min-width: 0; height: 100%; padding-bottom: 1px;
  display: flex; flex-direction: column; justify-content: center;
}
.set-sep { height: 1px; width: 100%; flex-shrink: 0; background: var(--wire-border-base-primary); }
.set-row:first-child .set-sep { visibility: hidden; }
.set-main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 8px; }
.set-label {
  flex: 1; min-width: 0;
  font-size: 17px; line-height: 22px; letter-spacing: -0.43px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.set-trail {
  flex-shrink: 0; display: flex; align-items: center; gap: 16px;
  font-size: 17px; line-height: 22px; letter-spacing: -0.43px;
  color: var(--wire-content-base-secondary);
}
.set-chev { width: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-disabled-primary); }
.set-popout { width: 16px; height: 16px; color: var(--wire-content-base-secondary); }
.set-swatch {
  width: 22px; height: 22px; border-radius: 100px; flex-shrink: 0;
  border: 1px solid var(--wire-border-base-primary);
  background-size: cover; overflow: hidden;
}
.set-check { width: 20px; display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-accent-primary); opacity: 0; }
.set-row[aria-checked="true"] .set-check { opacity: 1; }

/* Live previews — abstract wireframes, same as the Android build. */
.sd-previews { display: flex; gap: 12px; width: 100%; padding: 0 0 12px; }
.sd-prev-wrap { flex: 1 1 0; min-width: 0; }
.sd-prev {
  width: 100%; aspect-ratio: 92 / 176; border-radius: 12px; overflow: hidden;
  position: relative; border: 1px solid var(--wire-border-base-primary);
}
.pv-bar { position: absolute; border-radius: 3px; background: var(--wire-bg-base-tertiary); }
.pv-surface { position: absolute; left: 0; right: 0; background: var(--wire-bg-base-primary); }
.pv-row {
  display: flex; align-items: center; gap: 6px; padding: 5px 6px;
  border-bottom: 1px solid var(--wire-border-base-primary);
}
.pv-dot { width: 11px; height: 11px; border-radius: 1000px; flex-shrink: 0; }
.pv-line { height: 8px; border-radius: 3px; background: var(--wire-bg-base-tertiary); }
.pv-fab {
  position: absolute; right: 8px; bottom: 10px; width: 18px; height: 18px;
  border-radius: 6px; background: var(--wire-bg-accent-primary);
}
.pv-bubble-own {
  margin: 5px 6px 0 auto; width: 52%; height: 24px; border-radius: 8px;
  background: var(--wire-bg-accent-primary);
}
.pv-bubble-other {
  margin: 5px auto 0 6px; width: 62%; height: 30px; border-radius: 8px;
  background: var(--wire-bg-base-tertiary);
}
.pv-composer {
  position: absolute; left: 0; right: 0; bottom: 0; height: 22px;
  background: var(--wire-bg-base-primary); border-top: 1px solid var(--wire-border-base-primary);
}
.pv-header {
  position: absolute; left: 0; right: 0; top: 0; height: 36px;
  background: var(--wire-bg-base-primary); border-bottom: 1px solid var(--wire-border-base-primary);
}

/* Row-anchored menu inside Settings — same surface as the toolbar menu,
   presented from its anchor rather than morphing out of a capsule. */
.set-menu {
  position: absolute; z-index: 45;
  min-width: 250px; padding: 10px 16px; border-radius: 32px;
  background: var(--ios-menu-fill);
  -webkit-backdrop-filter: var(--ios-glass-blur);
  backdrop-filter: var(--ios-glass-blur);
  box-shadow: var(--ios-glass-lift);
  display: flex; flex-direction: column;
  transform-origin: top right; transform: scale(.86);
  opacity: 0; pointer-events: none;
  transition: transform .28s cubic-bezier(.32,.72,0,1), opacity .14s linear;
}
.set-menu.open { transform: scale(1); opacity: 1; pointer-events: auto; }
.set-menu .menu-opt { padding: 0 8px 0 6px; }

/* Inline segmented control (Theme) */
.set-seg {
  display: flex; padding: 2px; border-radius: 9px; gap: 2px;
  background: var(--wire-bg-base-tertiary);
}
.set-seg button {
  border: 0; font: inherit; font-size: 13px; line-height: 18px; font-weight: 500;
  padding: 4px 12px; border-radius: 7px; cursor: pointer;
  background: none; color: var(--wire-content-base-primary);
}
.set-seg button[aria-pressed="true"] {
  background: var(--wire-bg-base-primary);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}

/* Back control — the same glass capsule as the trailing toolbar group. */
.glass-group[hidden] { display: none; }

/* ─── CONVERSATION VIEW ────────────────────────────────────────────
   Spec: Kalium 50:9784 / 149:24147 — header 107, content, composer 104.
   SwiftUI: NavigationStack destination with a .safeAreaInset composer. */
.cv-title {
  position: absolute; left: 50%; top: 13px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  border: 0; background: none; padding: 0; font: inherit; cursor: pointer;
  font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.43px;
  color: var(--chrome-fg); white-space: nowrap; max-width: 200px;
}
.cv-title span:first-child { overflow: hidden; text-overflow: ellipsis; }
.cv-title .cv-chev { display: flex; flex-shrink: 0; color: var(--wire-content-base-secondary); }
.cv-scroll {
  flex: 1; min-height: 0; position: relative; z-index: 1;
  overflow-y: auto; overflow-x: hidden;
  background: var(--wire-bg-base-primary);
  padding: 8px 0 12px; scrollbar-width: none;
}
.cv-scroll::-webkit-scrollbar { display: none; }

/* Message rows ---------------------------------------------------- */
/* Row is 390 wide with an 80 inset on the far side, so a bubble can
   never span the full width. The 40 gutter is 8 + 26 + 6. */
.msg-row { display: flex; align-items: flex-end; padding: 4px 80px 4px 0; }
.msg-row.own { justify-content: flex-end; padding: 4px 16px 4px 80px; }
/* A 1:1 has no avatar gutter, so the bubble takes the 16 inset itself. */
.msg-row.other:not(.has-avatar) { padding-left: 16px; }
/* The gutter is held on every row of a run so the bubbles stay
   indented; the avatar itself only appears on the last one, sitting on
   the bottom edge of that bubble. */
.msg-avatar-gutter {
  width: 40px; flex-shrink: 0; padding: 0 6px 0 8px;
  display: flex; align-items: flex-end;
}
.msg-avatar-gutter .av-wrap, .msg-avatar-gutter .av-person { width: 26px; height: 26px; }
.msg-avatar-gutter .av-person { font-size: 10px; border-width: 1px; letter-spacing: 0; }
.msg-stack { display: flex; flex-direction: column; max-width: 270px; min-width: 0; }
.msg-row.own .msg-stack { align-items: flex-end; }

.bubble {
  padding: 10px; border-radius: 16px; min-width: 0;
  display: flex; flex-direction: column; gap: 4px;
}
.bubble.other { background: var(--wire-bg-bubbles-others-primary); color: var(--wire-content-base-primary); }
.bubble.own   { background: var(--wire-bg-bubbles-own-primary);   color: var(--wire-content-bubbles-own-on-primary); }
.msg-text {
  font-size: 17px; line-height: 22px; letter-spacing: -0.43px; max-width: 250px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg-sender {
  font-size: 12px; line-height: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.msg-external {
  font-size: 11px; line-height: 14px; font-weight: 500; padding: 0 4px;
  border-radius: 4px; background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary); color: var(--wire-content-base-secondary);
}
/* Status line inherits the bubble's own text colour at 70%. */
.msg-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; line-height: 16px; opacity: .7; color: inherit;
}
.bubble.own .msg-status { gap: 4px; align-self: flex-end; }

/* Assets sit on the bubble's 8px inset, as on desktop --------------- */
.msg-media { display: block; border-radius: 10px; overflow: hidden; max-width: 100%; }
.msg-media img { display: block; width: 100%; height: auto; }
.msg-media-fallback {
  display: flex; align-items: center; justify-content: center;
  height: 120px; border-radius: 10px; font-size: 13px;
  background: var(--wire-bg-base-tertiary); color: var(--wire-content-base-secondary);
}
.msg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.msg-grid .msg-media { border-radius: 6px; }
.msg-file, .msg-audio {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 10px; background: var(--wire-bg-base-primary);
  color: var(--wire-content-base-primary); min-width: 180px;
}
.msg-file-meta { display: flex; flex-direction: column; min-width: 0; }
.msg-file-name { font-size: 14px; line-height: 18px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-file-sub { font-size: 12px; line-height: 16px; color: var(--wire-content-base-secondary); }
.msg-audio-wave {
  flex: 1; height: 16px; border-radius: 8px; min-width: 60px;
  background: repeating-linear-gradient(to right,
    var(--wire-bg-accent-primary) 0 2px, transparent 2px 5px);
  opacity: .6;
}
.msg-reactions {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 0 10px; max-width: 270px;
  margin-top: -8px; position: relative;   /* chips overlap the bubble */
}
.msg-row.own .msg-reactions { justify-content: flex-end; }
.msg-reaction {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px;
  border-radius: 12px; font-size: 12px; line-height: 16px; font-weight: 600;
  background: var(--wire-bg-base-primary-focus);
  border: 1px solid var(--wire-bg-base-tertiary-focus);
  color: var(--wire-content-base-secondary);
}
.msg-reaction .emoji { font-size: 16px; line-height: 1; }
.msg-reaction.own-reaction {
  background: var(--wire-bg-accent-secondary);
  border-color: var(--wire-border-accent-primary);
  color: var(--wire-content-accent-primary);
}
.msg-divider {
  display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px;
  font-size: 12px; line-height: 16px; color: var(--wire-content-base-secondary);
}
.msg-divider .rule { flex: 1; height: 0.5px; background: var(--wire-border-base-primary); }
.msg-empty { padding: 48px 24px; text-align: center;
  font-size: 15px; color: var(--wire-content-base-secondary); }

/* Composer — Kalium 59:2236, 104 tall -------------------------------- */
.composer {
  flex-shrink: 0; position: relative; z-index: 2; height: 104px;
  background: var(--wire-bg-base-primary);
  border-top: 0.5px solid var(--wire-border-base-primary);
}
.cmp-input {
  position: absolute; left: 10px; right: 10px; top: 12px; height: 34px;
  display: flex; align-items: center; gap: 8px;
}
.cmp-btn {
  width: 40px; height: 32px; flex-shrink: 0; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-primary);
}
.cmp-placeholder {
  flex: 1; min-width: 0; font-size: 17px; line-height: 22px; letter-spacing: -0.43px;
  color: var(--wire-content-base-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cmp-send {
  width: 34px; height: 34px; flex-shrink: 0; border: 0; border-radius: 500px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
}
.cmp-actions {
  position: absolute; left: 10px; right: 10px; top: 60px;
  display: flex; align-items: stretch;
}
.cmp-actions button {
  flex: 1 1 0; min-width: 0; height: 32px; margin-right: -1px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-primary);
}
.cmp-actions button:first-child { border-radius: 12px 0 0 12px; }
.cmp-actions button:last-child  { border-radius: 0 12px 12px 0; margin-right: 0; }
.cmp-actions button:active, .cmp-btn:active, .cmp-send:active { opacity: .6; }

/* ─── PERSON AVATAR ────────────────────────────────────────────────
   DS "Initials" variant — identity tint, optional presence dot. */
.av-person {
  width: 44px; height: 44px; border-radius: 100px;
  border: 1.286px solid var(--wire-border-base-primary);
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-inverted-on-primary);
  font-size: 16px; font-weight: 600; letter-spacing: .2px;
  background-size: cover; background-position: center;
}
.av-presence {
  position: absolute; right: -1px; bottom: -1px;
  width: 10px; height: 10px; border-radius: 100px;
  background: var(--wire-bg-positive-primary);
  box-shadow: 0 0 0 2px var(--wire-bg-base-primary);
}
.av-presence[data-status="busy"] { background: var(--wire-bg-base-primary);
  box-shadow: inset 0 0 0 2px var(--wire-bg-danger-primary), 0 0 0 2px var(--wire-bg-base-primary); }
.av-presence[data-status="away"] { background: var(--wire-bg-warning-primary); }
.av-presence[data-status="none"] { display: none; }

/* ─── TRAILING BADGES ──────────────────────────────────────────────
   Same eleven types as desktop and Android, in the iOS shapes from
   Design Vision 278:14030 — dark pill r 6, outline pill for muted. */
.ci-badge {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; overflow: hidden;
}
.ci-badge.filled {
  background: var(--wire-bg-inverted-primary);
  color: var(--wire-content-inverted-on-primary);
}
.ci-badge.outline {
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-secondary);
}
.ci-badge.count { padding: 1px 8px; font-size: 12px; line-height: 16px; font-weight: 600; }
.ci-badge.glyph { padding: 3px 6px; }
.ci-badge.word  { padding: 1px 8px; font-size: 12px; line-height: 16px; font-weight: 500; }
.ci-badge.danger { color: var(--wire-content-danger-primary); border-color: var(--wire-border-danger-primary); }
.ci-badge.subtle { color: var(--wire-content-base-secondary); }

/* ─── SECTION HEADER (Group by → Conversation type) ────────────────
   SwiftUI: Section { … } header */
.sec-header {
  padding: 14px 16px 6px;
  font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -0.08px;
  color: var(--wire-content-base-secondary);
  background: var(--wire-bg-base-primary);
}
.list-empty {
  padding: 40px 16px; text-align: center;
  font-size: 15px; line-height: 20px;
  color: var(--wire-content-base-secondary);
}

/* ─── MENU (group / sort) ──────────────────────────────────────────
   Native iOS 26 menu — Kalium "Menu - iPhone" (370:56933).
   Glass container r 32, leading checkmark column, 17pt rows.
   SwiftUI: Menu { Picker(...) } on the toolbar's "more" button */
.menu {
  position: absolute; z-index: 40;
  background: var(--ios-menu-fill);
  -webkit-backdrop-filter: var(--ios-glass-blur);
  backdrop-filter: var(--ios-glass-blur);
  box-shadow: var(--ios-glass-lift);
  display: flex; flex-direction: column; overflow: hidden;
  /* Closed = the trailing capsule's exact footprint (100 x 44, r 296)
     at its exact position, so opening reads as one shape reshaping
     rather than a second surface appearing. */
  top: 0; right: 68px;
  width: 44px; height: 44px; border-radius: 296px;
  padding: 10px 16px;
  opacity: 0; pointer-events: none;
  transition:
    width  .34s cubic-bezier(.32,.72,0,1),
    height .34s cubic-bezier(.32,.72,0,1),
    border-radius .34s cubic-bezier(.32,.72,0,1),
    opacity .12s linear;
}
.menu.open {
  width: 250px; border-radius: 32px;
  opacity: 1; pointer-events: auto;
}
/* Fixed inner width so the rows never reflow while the shell resizes. */
.menu-inner {
  width: 218px; flex-shrink: 0;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity .16s linear;
}
.menu.open .menu-inner { opacity: 1; transition-delay: .10s; }
@media (prefers-reduced-motion: reduce) {
  .menu, .menu-inner, .glass-group { transition-duration: .01s; }
}
.menu-label {                                 /* Section Title */
  padding: 4px 8px 10px;
  font-size: 13px; line-height: 15px; font-weight: 500; letter-spacing: -0.08px;
  color: var(--wire-content-base-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.menu-opt {                                   /* Item */
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: 0; background: none; cursor: pointer; font: inherit; text-align: left;
  padding: 0 8px 0 6px;
  color: var(--wire-content-base-primary);
}
.menu-opt:active { opacity: .55; }
.menu-check {
  width: 24px; height: 22px; flex-shrink: 0; opacity: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-accent-primary);
}
.menu-opt[aria-checked="true"] .menu-check { opacity: 1; }
.menu-lbl {
  flex: 1; min-width: 0; padding: 10px 0;
  font-size: 17px; line-height: 22px; font-weight: 400; letter-spacing: -0.43px;
}
.menu-opt[aria-checked="true"] .menu-lbl {
  font-weight: 600; color: var(--wire-content-accent-primary);
}
.menu-opt[aria-disabled="true"] { cursor: default; }
.menu-opt[aria-disabled="true"] .menu-lbl { color: var(--wire-content-disabled-primary); }
.menu-sep {                                   /* Separator — 21pt row, 1px rule */
  height: 21px; padding: 0 8px; display: flex; align-items: center;
}
.menu-sep::before {
  content: ""; display: block; width: 100%; height: 1px;
  background: var(--wire-border-base-primary);
}

/* ─── TAB BAR ──────────────────────────────────────────────────────
   iOS 26 floating glass TabView + bottom scroll-edge effect.
   SwiftUI: TabView { Tab(...) } — chrome material is automatic. */
.tab-wrap {
  position: absolute; left: 0; right: 0; bottom: 0; height: 95px;
  z-index: 4; pointer-events: none;
}
.tab-edge {
  position: absolute; left: 0; right: 0; bottom: 0; height: 112px;
  -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px);
  -webkit-mask-image: linear-gradient(to top, #000 42%, transparent 100%);
  mask-image: linear-gradient(to top, #000 42%, transparent 100%);
  background: linear-gradient(to top, var(--ios-edge-fill), transparent 96%);
}
.tab-bar {
  position: absolute; left: 21px; right: 21px; top: 17px;
  height: 49px; border-radius: 296px; pointer-events: auto;
  background: var(--ios-glass-fill);
  -webkit-backdrop-filter: var(--ios-glass-blur);
  backdrop-filter: var(--ios-glass-blur);
  box-shadow: var(--ios-glass-lift);
  display: flex; align-items: center; padding: 0 6px;
}
.tab {
  flex: 1; height: 41px; border: 0; background: none; padding: 0; cursor: pointer;
  border-radius: 100px; position: relative;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-base-primary);
}
.tab[aria-selected="true"] {
  background: var(--wire-bg-base-tertiary);
  color: var(--wire-content-accent-primary);
}
.tab:active { opacity: .6; }
.tab:focus { outline: none; }
.tab:focus-visible { outline: 2px solid var(--wire-border-accent-primary); outline-offset: 2px; }

    <div class="set-top-edge" data-screen="settings"></div>
    <div class="set-menu" id="set-menu" role="menu" data-screen="settings" data-swiftui="Menu"></div>

  /* ── Filters — All / Unread / Favorites, AND semantics ───────────── */
  var FILTERS = [
    { id: 'all',       label: 'All' },

  var UNREAD_STATES = ['unread', 'mention', 'reply', 'thread', 'ping',
                       'missed-call', 'muted-mention', 'muted-reply',
                       'incoming-request', 'onboarding'];
  var activeFilters = [];

  function hasFilter(id) { return activeFilters.indexOf(id) !== -1; }
  function toggleFilter(id) {
    var i = activeFilters.indexOf(id);
    if (i === -1) { activeFilters.push(id); } else { activeFilters.splice(i, 1); }
  }
  function matchesFilter(c) {
    if (!activeFilters.length) { return true; }
    if (hasFilter('unread')    && UNREAD_STATES.indexOf(c.state) === -1) { return false; }
    if (hasFilter('favorites') && !c.favorite) { return false; }
    return true;
  }
  function emptyMessage() {
    if (hasFilter('unread') && hasFilter('favorites')) { return 'Nothing matches these filters'; }
    if (hasFilter('favorites')) { return 'No favorites'; }
    if (hasFilter('unread'))    { return 'No unread conversations'; }
    return 'No conversations';
  }

  /* ── Render ─────────────────────────────────────────────────────── */
  function rowHTML(c) {
    return '<div class="conv-row" role="listitem" tabindex="0" data-conv="' + c.convKey + '">'
         +   '<span class="cr-inner">'
         +     '<span class="cr-avatar">' + avatarFor(c) + '</span>'
         +     '<span class="cr-body">'

         +         '<span class="cr-title">' + c.name + '</span>'

         +       '</span>'
         +       '<span class="cr-trail">' + badge(c.badge, c.count) + '</span>'
         +     '</span>'
         +   '</span>'
         + '</div>';
  }

  function sortRows(list) {
    var l = list.slice();
    if (sortBy === 'alphabet') { l.sort(function (a, b) { return a.name.localeCompare(b.name); }); }
    else { l.sort(function (a, b) { return b.activity - a.activity; }); }
    return l;
  }

  function renderList() {
    var list = document.getElementById('conv-list');
    var shown = sortRows(CONVERSATIONS.filter(matchesFilter));
    if (!shown.length) {
      list.innerHTML = '<div class="list-empty">' + emptyMessage() + '</div>';
      return;
    }
    if (groupBy === 'type') {
      list.innerHTML = BUCKETS.map(function (b) {
        var inBucket = shown.filter(function (c) { return c.kind === b.kind; });
        if (!inBucket.length) { return ''; }
        return '<div class="sec-header">' + b.label + '</div>' + inBucket.map(rowHTML).join('');
      }).join('');
    } else {
      list.innerHTML = shown.map(rowHTML).join('');
    }
  }

  function syncFilterPills() {
    Array.prototype.forEach.call(document.querySelectorAll('.filter-pill'), function (b) {
      var on = b.dataset.filter === 'all' ? !activeFilters.length : hasFilter(b.dataset.filter);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function renderFilters() {
    var bar = document.getElementById('filter-bar');
    bar.innerHTML = FILTERS.map(function (f) {
      return '<button class="filter-pill" data-filter="' + f.id + '" aria-pressed="false">'
           + f.label + '</button>';
    }).join('');
    syncFilterPills();
    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-pill'); if (!btn) { return; }
      if (btn.dataset.filter === 'all') { activeFilters = []; }
      else { toggleFilter(btn.dataset.filter); }
      syncFilterPills(); renderList();
    });
  }

  function renderMenu() {
    var inner = MENU.map(function (sec, si) {
      var current = sec.axis === 'group' ? groupBy : sortBy;
      var opts = sec.options.map(function (o) {
        var on = o.id === current && !o.disabled;
        return '<button class="menu-opt" role="menuitemradio" data-axis="' + sec.axis + '" data-id="' + o.id + '"'
             + ' aria-checked="' + on + '"'
             + (o.disabled ? ' aria-disabled="true" title="Not available yet"' : '')
             + '><span class="menu-check">' + ic('check', 17) + '</span>'
             + '<span class="menu-lbl">' + o.label + '</span></button>';
      }).join('');
      return (si ? '<div class="menu-sep" role="separator"></div>' : '')
           + '<div class="menu-label">' + sec.label + '</div>' + opts;
    }).join('');
    document.getElementById('conv-menu').innerHTML =
      '<div class="menu-inner">' + inner + '</div>';
  }

  function bindMenu() {
    var btn   = document.getElementById('tb-more');
    var menu  = document.getElementById('conv-menu');
    var group = document.getElementById('more-group');

    /* Natural height of the expanded menu: inner content + 10pt padding
       top and bottom. Measured live so it survives content changes. */
    function naturalHeight() {
      var inner = menu.querySelector('.menu-inner');
      return inner.scrollHeight + 20;
    }
    function isOpen() { return menu.classList.contains('open'); }

    function open() {
      menu.style.height = naturalHeight() + 'px';
      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      group.setAttribute('data-absorbed', 'true');
    }
    function close() {
      if (!isOpen()) { return; }
      menu.classList.remove('open');
      menu.style.height = '';
      btn.setAttribute('aria-expanded', 'false');
      group.removeAttribute('data-absorbed');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isOpen()) { close(); } else { open(); }
    });
    menu.addEventListener('click', function (e) {
      e.stopPropagation();
      var opt = e.target.closest('.menu-opt');
      if (!opt || opt.getAttribute('aria-disabled') === 'true') { return; }
      if (opt.dataset.axis === 'group') { groupBy = opt.dataset.id; }
      else { sortBy = opt.dataset.id; }
      /* Update the checkmark, then collapse back into the capsule. */
      renderMenu(); renderList(); close();
    });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { close(); } });
  }

  /* Menu contents for the two pickers — same rows as the toolbar menu. */
  function menuOpt(attrs, checked, label, swatch, swatchCls) {
    var dot = '';

         +   '<span class="menu-check">' + ic('check', 17) + '</span>'
         +   dot
         +   '<span class="menu-lbl">' + label + '</span>'

  var PICKERS = {

      var a = currentAccent();
      return '<div class="menu-label">Accent color</div>'
           + ACCENTS.map(function (x) {
               return menuOpt('data-accent-set="' + x + '"', x === a, ACCENT_LABELS[x],
                              accentSwatch(x));
             }).join('');

    background: function () {
      return '<div class="menu-label">Background</div>'
           + MOODS.map(function (m) {
               return menuOpt('data-mood-set="' + m + '"', m === currentMood,
                              MOOD_LABELS[m], null, 'bg-preview bg-mood-' + m);

  var SET_SCREENS = {
    root:       { title: 'Settings',   html: settingsRootHtml },

  function renderSettings() {
    var id = setStack[setStack.length - 1];
    var screen = SET_SCREENS[id];
    document.getElementById('set-scroll').innerHTML = screen.html();
    document.getElementById('set-title').textContent = screen.title;
    var wrap = document.getElementById('set-back-wrap');
    var prev = SET_SCREENS[setStack[setStack.length - 2]];
    wrap.hidden = setStack.length < 2;
    var back = document.getElementById('set-back');
    back.innerHTML = ic('back', 20);
    back.setAttribute('aria-label', prev ? 'Back to ' + prev.title : 'Back');

  function applyAccent(v) { root.setAttribute('data-accent', v); }
  function applyMood(v) {
    var p = document.getElementById('page');
    currentMood = v;
    MOODS.forEach(function (m) { p.classList.remove('bg-mood-' + m); });
    p.classList.add('bg-mood-' + currentMood);
    applyChrome();
  }

  function closeSetMenu() {
    var m = document.getElementById('set-menu');
    m.classList.remove('open');
    Array.prototype.forEach.call(document.querySelectorAll('.set-row[aria-expanded]'), function (r) {
      r.setAttribute('aria-expanded', 'false');
    });
  }
  function openSetMenu(kind, row) {
    var m = document.getElementById('set-menu');
    m.dataset.kind = kind;
    m.innerHTML = PICKERS[kind]();
    m.style.right = '16px';
    m.style.top = '0px';

    /* Layout metrics (offset*, not rects) so the entry transform does
       not skew the measurement. */
    var pageRect = document.getElementById('page').getBoundingClientRect();
    var r = row.getBoundingClientRect();
    var rowTop = r.top - pageRect.top;
    var h = m.offsetHeight;
    var checked = m.querySelector('.menu-opt[aria-checked="true"]') || m.querySelector('.menu-opt');

    /* Sit the selected option directly over the row it came from. */
    var top = rowTop + (r.height - checked.offsetHeight) / 2 - checked.offsetTop;
    top = Math.max(115, Math.min(top, 741 - h));

    m.style.top = top + 'px';
    m.style.transformOrigin = 'right ' + Math.round(rowTop + r.height / 2 - top) + 'px';
    m.classList.add('open');
    row.setAttribute('aria-expanded', 'true');
  }

  function bindSettings() {
    document.getElementById('set-back').addEventListener('click', function () {
      closeSetMenu();
      if (setStack.length > 1) { setStack.pop(); renderSettings(); }
    });

    document.getElementById('set-scroll').addEventListener('click', function (e) {
      /* The segmented control lives inside a row, so it is checked first. */
      var seg = e.target.closest('[data-theme-set]');
      if (seg) {
        root.setAttribute('data-theme', seg.dataset.themeSet);
        applyChrome(); renderSettings(); return;
      }
      var row = e.target.closest('.set-row'); if (!row) { return; }
      var d = row.dataset;
      if (d.setting) { if (d.ready === 'true') { setStack.push('appearance'); renderSettings(); } return; }
      if (d.menu) {
        e.stopPropagation();
        var m = document.getElementById('set-menu');
        if (m.classList.contains('open') && m.dataset.kind === d.menu) { closeSetMenu(); }
        else { openSetMenu(d.menu, row); }
      }
    });

    document.getElementById('set-menu').addEventListener('click', function (e) {
      e.stopPropagation();
      var opt = e.target.closest('.menu-opt'); if (!opt) { return; }
      if (opt.dataset.accentSet) { applyAccent(opt.dataset.accentSet); }
      if (opt.dataset.moodSet)   { applyMood(opt.dataset.moodSet); }
      var kind = this.dataset.kind;
      this.innerHTML = PICKERS[kind]();
      renderSettings();
      closeSetMenu();
    });

    /* Scrolling or tapping elsewhere dismisses it, as a menu should. */
    document.addEventListener('click', closeSetMenu);
    document.getElementById('set-scroll').addEventListener('scroll', closeSetMenu);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSetMenu(); } });
  }

  /* ── Conversation view ───────────────────────────────────────────
     Renderers ported from the Android build so both platforms lay the
     same data out the same way; only the chrome differs. */
  function dayLabel(n) {
    if (n === 0) { return 'Today'; }
    if (n === 1) { return 'Yesterday'; }
    var d = new Date(Date.now() - n * DAY_MS);
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  /* Consecutive messages from one sender sharing a timestamp form
     one run — same rule as desktop and the Figma spec. */
  function groupMessages(msgs) {
    var runs = [];
    msgs.forEach(function (m) {
      var last = runs[runs.length - 1];
      if (last && last.sender === m.sender && last.time === m.time) { last.bubbles.push(m); }
      else { runs.push({ sender: m.sender, time: m.time, bubbles: [m] }); }
    });
    return runs;
  }

  function mediaHtml(src) {
    return '<span class="msg-media"><img src="' + src + '" alt="" '
         + 'onerror="this.parentNode.outerHTML=\'<span class=&quot;msg-media-fallback&quot;>Image</span>\'"></span>';
  }

  function bodyHtml(m) {
    var out = '';
    if (m.text) { out += '<span class="msg-text">' + m.text + '</span>'; }
    if (m.type === 'image' || m.type === 'image-solo'
        || m.type === 'image-with-text' || m.type === 'video-solo') {
      if (m.src) { out += mediaHtml(m.src); }
    }
    if (m.type === 'media-grid' && m.media) {
      out += '<span class="msg-grid">' + m.media.map(function (x) { return mediaHtml(x.src); }).join('') + '</span>';
    }
    if (m.type === 'file-solo' || m.type === 'file-with-text') {
      out += '<span class="msg-file">' + ic('drive', 20)
           + '<span class="msg-file-meta"><span class="msg-file-name">' + (m.filename || 'File') + '</span>'
           + '<span class="msg-file-sub">' + [m.filetype, m.filesize].filter(Boolean).join(' \u00b7 ') + '</span></span></span>';
    }
    if (m.type === 'audio') {
      out += '<span class="msg-audio">' + ic('meetings', 16)
           + '<span class="msg-audio-wave"></span>'
           + '<span class="msg-file-sub">' + (m.duration || '0:12') + '</span></span>';
    }
    return out;
  }

  function reactionsHtml(m) {
    if (!m.reactions || !m.reactions.length) { return ''; }
    return '<div class="msg-reactions">' + m.reactions.map(function (r) {
      return '<span class="msg-reaction' + (r.own ? ' own-reaction' : '') + '">'
           + '<span class="emoji">' + r.emoji + '</span>'
           + '<span class="count">' + r.count + '</span></span>';
    }).join('') + '</div>';
  }

  function renderThread(key, isGroupConv) {
    var host = document.getElementById('cv-messages');
    var msgs = THREADS[key];
    if (!msgs || !msgs.length) {
      host.innerHTML = '<div class="msg-empty">No messages yet.</div>';
      return;
    }
    var html = '', buffer = [];

    function flush() {
      if (!buffer.length) { return; }
      groupMessages(buffer).forEach(function (run) {
        var own = run.sender === 'self';
        var showAvatar = isGroupConv && !own;
        run.bubbles.forEach(function (m, i) {
          var first = i === 0, last = i === run.bubbles.length - 1;
          var cls = 'msg-row ' + (own ? 'own' : 'other')
                  + (showAvatar ? ' has-avatar' : '')
                  + (first ? ' first' : '') + (last ? ' last' : '');
          /* Spec 60:2122: the avatar sits on the bottom edge of the
             run's *last* bubble, not its first. */
          var gutter = showAvatar
            ? '<span class="msg-avatar-gutter">'
              + (last ? personAvatar({ initials: m.initials, color: m.color }) : '') + '</span>'
            : '';
          var sender = (showAvatar && first)
            ? '<span class="msg-sender" style="color:var(--wire-identity-' + (m.color || 'blue') + ')">' + m.sender
              + (m.external ? '<span class="msg-external">External</span>' : '') + '</span>'
            : '';
          var status = last
            ? '<span class="msg-status">' + run.time
              + (own ? ic('delivered', 13) : '') + '</span>'
            : '';
          html += '<div class="' + cls + '">' + gutter
                + '<div class="msg-stack">'
                +   '<div class="bubble ' + (own ? 'own' : 'other') + '">'
                +     sender + bodyHtml(m) + status
                +   '</div>'
                +   reactionsHtml(m)
                + '</div></div>';
        });
      });
      buffer = [];
    }

    msgs.forEach(function (m) {
      if (m.divider) {
        flush();
        html += '<div class="msg-divider"><span class="rule"></span><span>'
             + (m.divider === 'day' ? dayLabel(m.day) : m.time)
             + '</span><span class="rule"></span></div>';
      } else {
        buffer.push(m);
      }
    });
    flush();
    host.innerHTML = html;
  }

  var COMPOSER_ACTIONS = ['ping', 'drive', 'meetings', 'channel', 'mention', 'check'];

  function openConversation(convKey) {
    var c = CONVERSATIONS.filter(function (x) { return x.convKey === convKey; })[0];

    document.getElementById('cv-title').textContent = c.name;
    renderThread(convKey, c.kind !== 'person');

    var sc = document.getElementById('cv-scroll');
    sc.scrollTop = sc.scrollHeight;          /* newest message in view */
  }

  function bindConversation() {

  /* ── Tabs — same destinations and glyphs as the Android nav bar ──── */
  var TABS = [
    { id: 'conversations', label: 'Conversations', selected: true },
    { id: 'drive',         label: 'Drive' },
    { id: 'meetings',      label: 'Meetings' },
    { id: 'settings',      label: 'Settings' },
    { id: 'search',        label: 'Search' }
  ];
  function renderTabs() {
    var bar = document.getElementById('tab-bar');
    bar.innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-label="' + t.label + '"'
           + ' aria-selected="' + (t.selected ? 'true' : 'false') + '">'
           + ic(t.id, 24, !!t.selected) + '</button>';
    }).join('');
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('.tab'); if (!b) { return; }
      Array.prototype.forEach.call(bar.querySelectorAll('.tab'), function (el) {
        el.setAttribute('aria-selected', String(el === b));
        el.innerHTML = ic(el.dataset.tab, 24, el === b);
      });
      var dest = b.dataset.tab === 'settings' ? 'settings' : 'conversations';
      /* Tabs always exit a conversation. */
      document.getElementById('page').setAttribute('data-dest', dest);
      closeSetMenu();
      if (dest === 'settings') { setStack = ['root']; renderSettings(); }
    });
  }

  function renderChrome() {
    document.getElementById('tb-more').innerHTML = ic('overflow', 20);
    document.getElementById('tb-plus').innerHTML = ic('compose', 20);
    document.getElementById('tb-av').textContent = 'KD';
  }

  renderChrome(); renderFilters(); renderMenu(); bindMenu(); renderList(); renderTabs();
  renderSettings(); bindSettings(); bindConversation(); applyChrome();
})();
</script>
</body>
</html>
