  ];

  /* Mirrors the desktop prototype's FILES list so both platforms search
     the same set. Android has no Drive yet, so a hit opens the
     conversation the file was shared in. */
  var FILES = [
    { name: 'Q3_Revenue_Model_v4.xlsx', ftype: 'Spreadsheet', conv: 'prodeng',
      by: 'Tom Berger',  icon: 'ph-microsoft-excel-logo', color: 'green'  },
    { name: 'Offsite_Location.png',     ftype: 'Image',       conv: 'prodeng',
      by: 'Mara Voss',   icon: 'ph-image',                color: 'purple' },
    { name: 'Demo_Recording.mp4',       ftype: 'Video',       conv: 'prodeng',
      by: 'Tom Berger',  icon: 'ph-file-video',           color: 'petrol' },
    { name: 'Brand_Guidelines.pdf',     ftype: 'PDF',         conv: 'marketing',
      by: 'Lena Roth',   icon: 'ph-file-pdf',             color: 'red'    },
    { name: 'Design_Tokens.json',       ftype: 'Code',        conv: 'design',
      by: 'You',         icon: 'ph-brackets-curly',       color: 'blue'   },
    { name: 'Sprint_Notes.docx',        ftype: 'Document',    conv: 'prodeng',
      by: 'Priya Anand', icon: 'ph-file-doc',             color: 'blue'   }
  ];
  var searchFilter = 'all';
  var searchQuery  = '';
  var searchScope  = null;   /* a conversation, or null for everywhere */

  function svEsc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function svHi(text, q, cls) {
    var safe = svEsc(text);
    if (!q) return safe;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return safe.replace(re, '<span class="' + (cls || 'hit-body') + '">$1</span>');
  }

  function svTypeLabel(c) {
    return c.kind === 'channel' ? 'Channel' : c.kind === 'group' ? 'Group' : '1:1 conversation';
  }

  /* Every message with text, flattened and tied back to its conversation. */
  function svMessages() {
    var out = [];
    CONVERSATIONS.forEach(function (c) {
      convMessages(c.convKey).forEach(function (m) {
        out.push({ conv: c, sender: m.sender, color: m.color, initials: m.initials,
                   external: m.external, time: m.time, day: m.day, text: m.text });
      });
    });
    return out;
  }

  function svMatchConvs(q) {
    return CONVERSATIONS.filter(function (c) {
      if (searchScope && c.convKey !== searchScope.convKey) return false;
      return !q || c.name.toLowerCase().indexOf(q) !== -1;
    });
  }
  function svMatchMessages(q) {
    if (!q) return [];
    return svMessages().filter(function (m) {
      if (searchScope && m.conv.convKey !== searchScope.convKey) return false;
      return m.text.toLowerCase().indexOf(q) !== -1;
    });
  }

  function svRenderScope() {
    var chip = document.getElementById('sv-scope');
    var input = document.getElementById('sv-input');
    if (!searchScope) {
      chip.style.display = 'none';
      input.placeholder = 'Search Wire';
      return;
    }
    chip.style.display = 'flex';
    document.getElementById('sv-scope-name').textContent = searchScope.name;
    input.placeholder = 'Search this conversation';
  }

  function svMatchFiles(q) {
    return FILES.filter(function (f) {
      if (searchScope && f.conv !== searchScope.convKey) return false;
      return !q || f.name.toLowerCase().indexOf(q) !== -1;
    });
  }

  function svCounts(q) {
    var c = svMatchConvs(q), m = svMatchMessages(q), f = svMatchFiles(q);
    var by = function (k) { return c.filter(function (x) { return x.kind === k; }).length; };
    return {
      conversations: c.length,
      favorites: c.filter(function (x) { return x.favorite; }).length,
      channels: by('channel'), groups: by('group'), people: by('person'),
      files: f.length, messages: m.length,
      all: c.length + f.length + m.length
    };
  }

  function svRenderChips() {
    var counts = svCounts(searchQuery);
    document.getElementById('sv-chips').innerHTML = SEARCH_FILTERS.map(function (f) {
      var n = counts[f.id];
      return '<button class="filter-pill" data-sv-filter="' + f.id + '" '
           +   'aria-pressed="' + (f.id === searchFilter) + '" data-m3="FilterChip">'
           +   f.label + (n ? '<span class="sv-count">' + n + '</span>' : '')
           + '</button>';
    }).join('');
  }

  function svConvRow(c, q) {
    return '<li class="conv-item" data-sv-conv="' + c.convKey + '" data-state="default" data-m3="ListItem">'
         +   '<div class="av">' + avatarFor(c) + '</div>'
         +   '<div class="ci-body">'
         +     '<div class="ci-line"><span class="ci-name">' + svHi(c.name, q, 'hit-name') + '</span></div>'
         +     '<div class="ci-sub">' + svTypeLabel(c) + '</div>'
         +   '</div>'
         + '</li>';

  /* Spec: Android / 39692:274163 — avatar, sender, right-aligned date,
     snippet trimmed around the match. The conversation is named only
     when the search is not already scoped to one. */
  function svMsgRow(m, q) {
    var self = m.sender === 'self';
    var av = personAvatar(self
      ? { initials: 'KD', color: 'blue' }
      : { initials: m.initials, color: m.color });

         +     '<div class="cs-head">'

         +       '</span>'

         +       '<span class="cs-time">' + shortDay(m.day) + ', ' + svEsc(m.time) + '</span>'

         +   '<div class="ci-body">'
         +     '<div class="ci-line"><span class="ci-name">' + svHi(f.name, q, 'hit-name') + '</span></div>'
         +     '<div class="ci-sub">' + svEsc(meta) + '</div>'

         + '</li>';

  function svRenderResults() {
    var q = searchQuery, el = document.getElementById('sv-results');
    var convs = svMatchConvs(q), msgs = svMatchMessages(q);
    var files = svMatchFiles(q), html = '';

    function section(label, rows) {
      if (!rows.length) return '';
      return '<li class="section-label" role="presentation">' + label + '</li>' + rows.join('');
    }
    var pick = function (k) {
      return convs.filter(function (c) { return c.kind === k; }).map(function (c) { return svConvRow(c, q); });
    };

    var convSections = function () {
      return section('Channels', pick('channel'))
           + section('Groups',   pick('group'))
           + section('People',   pick('person'));
    };

    if (searchFilter === 'all') {
      html = convSections()
           + section('Files',    files.map(function (f) { return svFileRow(f, q); }))
           + section('Messages', msgs.map(function (m) { return svMsgRow(m, q); }));
    } else if (searchFilter === 'conversations') {
      html = convSections();
    } else if (searchFilter === 'files') {
      html = files.map(function (f) { return svFileRow(f, q); }).join('');
    } else if (searchFilter === 'favorites') {
      html = convs.filter(function (c) { return c.favorite; })
                  .map(function (c) { return svConvRow(c, q); }).join('');
    } else if (searchFilter === 'messages') {
      html = msgs.map(function (m) { return svMsgRow(m, q); }).join('');
    } else {
      html = pick(searchFilter === 'channels' ? 'channel'
                : searchFilter === 'groups'   ? 'group' : 'person').join('');
    }

    if (!html) {
      html = '<li class="sv-empty">'
           + (searchFilter === 'messages' && !q
                ? (searchScope ? 'Type to search this conversation' : 'Type to search messages')
                : q ? 'No results for \u201C' + svEsc(q) + '\u201D'
                    : 'Nothing to show')
           + '</li>';
    }
    el.innerHTML = '<ul class="conv-list" style="padding-bottom:0">' + html + '</ul>';
  }

  function svRender() { svRenderScope(); svRenderChips(); svRenderResults(); }

  /* ── Android keyboard ────────────────────────────────────────────
     Rises with the search view, the way Gboard does when a field takes
     focus. Keys drive the search field so the prototype is usable on a
     touch screen without a hardware keyboard. */
  var KB_ROWS = [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['\u21e7','z','x','c','v','b','n','m','\u232b'],
    ['?123',',',' ','.','\u2315']
  ];

  function renderKeyboard() {
    var rows = KB_ROWS.map(function (row, ri) {
      var keys = row.map(function (k) {
        if (k === ' ')     return '<button class="kb-key space" data-key=" " aria-label="Space"></button>';
        if (k === '\u21e7') return '<button class="kb-key mod wide" data-key="shift" aria-label="Shift">\u21e7</button>';
        if (k === '\u232b') return '<button class="kb-key mod wide" data-key="back" aria-label="Backspace">\u232b</button>';
        if (k === '?123')  return '<button class="kb-key mod wide" data-key="sym" aria-label="Symbols">?123</button>';
        if (k === '\u2315') return '<button class="kb-key action wide" data-key="go" aria-label="Search">\u2315</button>';
        return '<button class="kb-key" data-key="' + k + '">' + k + '</button>';
      }).join('');
      /* Gboard insets the home row by half a key. */
      if (ri === 1) return '<div class="kb-row"><span class="kb-spacer"></span>' + keys + '<span class="kb-spacer"></span></div>';
      return '<div class="kb-row">' + keys + '</div>';
    }).join('');

    document.getElementById('sv-keyboard').innerHTML =
        '<div class="kb-suggest"><span>design</span><span>designs</span><span>designer</span></div>' + rows;
  }

  function bindKeyboard() {
    var kb = document.getElementById('sv-keyboard');
    renderKeyboard();

    /* Keep the field focused — a key press must not steal the caret. */
    kb.addEventListener('mousedown', function (e) { e.preventDefault(); });

    kb.addEventListener('click', function (e) {
      var key = e.target.closest('[data-key]');
      if (!key) return;
      var input = document.getElementById('sv-input');
      var k = key.dataset.key;

      if (k === 'back')                      input.value = input.value.slice(0, -1);
      else if (k === 'shift' || k === 'sym' || k === 'go') { input.focus(); return; }
      else if (k === 'suggest')              return;
      else                                   input.value += k;

      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    });
  }

  function searchIsOpen() {
    return document.getElementById('search-view').classList.contains('open');
  }
  function openSearch(scope, filter) {
    searchQuery = '';
    searchScope = scope || null;
    searchFilter = filter || 'all';

  /* ── Conversation details + search in conversation ────────────────
     Details is reached by pressing the conversation title; the Search
     button inside it opens a search scoped to that conversation. */

  var currentConv = null;

  /* Flatten a thread, carrying the day divider forward so each hit can
     show a date the way the spec does ("Sep 3, 12:23 PM"). */
  function convMessages(key) {
    var out = [], day = 0;
    (THREADS[key] || []).forEach(function (m) {
      if (m.divider === 'day') { day = m.day; return; }
      if (m.divider || !m.text) return;
      out.push({
        sender: m.sender, color: m.color, initials: m.initials,
        external: !!m.external, time: m.time, text: m.text, day: day
      });
    });
    return out;
  }

  function shortDay(n) {
    if (n === 0) return 'Today';
    if (n === 1) return 'Yesterday';
    var d = new Date(Date.now() - n * DAY_MS);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  /* Participants are derived from who actually speaks in the thread,
     plus the signed-in user. Admins are the first two. */
  function participantsFor(c) {
    var seen = {}, list = [];
    convMessages(c.convKey).forEach(function (m) {
      if (m.sender === 'self' || seen[m.sender]) return;
      seen[m.sender] = true;
      list.push({
        name: m.sender, color: m.color, initials: m.initials,
        qualifier: m.external ? 'External' : null,
        handle: '@' + m.sender.toLowerCase().replace(/\s+/g, '.')
      });
    });
    if (c.kind === 'person' && !seen[c.name]) {
      list.unshift({
        name: c.name, color: c.avatar.color, initials: c.avatar.initials,
        presence: c.avatar.presence, qualifier: null,
        handle: '@' + c.name.toLowerCase().replace(/\s+/g, '.')
      });
    }
    list.push({
      name: 'Kasimir Dengler (You)', color: 'blue', initials: 'KD',
      presence: 'available', qualifier: null, handle: '@kasimir'
    });
    return list;
  }

  /* ── Details screen ───────────────────────────────────────────── */

  var detailsTab = 'options';

  var CD_SETTINGS = [
    { section: 'Access', items: [
      { id: 'guests', label: 'Guests', on: false,

  /* Trim the snippet around the first match, the way the spec does:
     a leading ellipsis when the line is cut, match marked by weight. */
  function csSnippet(text, q) {
    var i = text.toLowerCase().indexOf(q);
    if (i === -1) return svEsc(text);
    var start = Math.max(0, i - 40);
    var head = (start > 0 ? '\u2026' : '') + text.slice(start, i);
    var out = svEsc(head) + '<span class="hit-body">' + svEsc(text.substr(i, q.length)) + '</span>';
    var rest = text.slice(i + q.length), from = 0, j;
    while ((j = rest.toLowerCase().indexOf(q, from)) !== -1) {
      out += svEsc(rest.slice(from, j))
           + '<span class="hit-body">' + svEsc(rest.substr(j, q.length)) + '</span>';
      from = j + q.length;
    }
    return out + svEsc(rest.slice(from));
  }

  function openConversation(c) {
    currentConv = c;
    document.getElementById('cv-title').textContent = c.name;
    document.getElementById('cv-avatar').innerHTML = avatarFor(c);
    renderThread(c.convKey, c.kind !== 'person');
    document.getElementById('conv-view').classList.add('open');
    document.getElementById('cv-scroll').scrollTop = 0;
  }
  function closeConversation() { document.getElementById('conv-view').classList.remove('open'); }

  function bindConversationView() {
    document.getElementById('cv-back').innerHTML   = WDS.icon('back',     { size: 16 });
    document.getElementById('cv-action').innerHTML = WDS.icon('videocall', { size: 16 });
    document.getElementById('cv-chevron').innerHTML = WDS.icon('dropdown', { size: 16 });
    document.getElementById('cv-send').innerHTML   = WDS.icon('send',     { size: 16 });
    document.getElementById('cv-back').addEventListener('click', closeConversation);
    document.addEventListener('keydown', function (e) {

    });

  /* ── Group & sort menu ─────────────────────────────────────────
     Same systematic as the desktop filter menu: labelled sections,
     radio options with a trailing check, unbuilt options shown inert.
     "Filter by" lives in the pills now, so it is absent here. */
  var MENU = [
    { axis: 'group', label: 'Group by', options: [
        { id: 'none',    label: 'None' },
        { id: 'type',    label: 'Conversation type' },
        { id: 'folders', label: 'Folders', disabled: true }
      ] },
    { axis: 'sort', label: 'Sort by', options: [
        { id: 'activity', label: 'Activity' },
        { id: 'alphabet', label: 'Alphabetical' }
      ] }
  ];
  var groupBy = 'none';
  var sortBy  = 'activity';

  /* Grouping buckets mirror desktop: Channels / Groups / 1:1 Conversations */
  var BUCKETS = [
    { kind: 'channel', label: 'Channels' },
    { kind: 'group',   label: 'Groups' },
    { kind: 'person',  label: '1:1 Conversations' }
  ];

  function renderMenu() {
    var menu = document.getElementById('conv-menu');
    menu.innerHTML = MENU.map(function (sec, si) {
      var current = sec.axis === 'group' ? groupBy : sortBy;
      var opts = sec.options.map(function (o) {
        var on = o.id === current && !o.disabled;
        return '<button class="menu-opt" role="menuitemradio" data-axis="' + sec.axis + '" data-id="' + o.id + '"'
             + ' aria-checked="' + on + '"'
             + (o.disabled ? ' aria-disabled="true" title="Not yet implemented"' : '')
             + '><span>' + o.label + '</span>'
             + '<span class="menu-check">' + WDS.icon('check', { size: 18 }) + '</span></button>';
      }).join('');
      return (si ? '<div class="menu-sep" role="separator"></div>' : '')
           + '<div class="menu-label">' + sec.label + '</div>' + opts;
    }).join('');
  }

  function bindMenu() {
    var btn  = document.getElementById('tb-overflow');
    var menu = document.getElementById('conv-menu');
    function close() { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    function open()  { menu.classList.add('open');    btn.setAttribute('aria-expanded', 'true'); }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.classList.contains('open') ? close() : open();
    });
    menu.addEventListener('click', function (e) {
      e.stopPropagation();
      var opt = e.target.closest('.menu-opt');
      if (!opt || opt.getAttribute('aria-disabled') === 'true') return;
      if (opt.dataset.axis === 'group') groupBy = opt.dataset.id;
      else                              sortBy  = opt.dataset.id;
      renderMenu();
      renderList();
    });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  /* ── Filters ───────────────────────────────────────────────────
     Order follows the mock (All / Unread / Favorites). Unread and
     Favorites combine — a row must satisfy every active filter (the
     same AND semantics as the desktop filter menu). "All" is not a
     filter of its own; it clears the set, and reads as pressed
     whenever nothing else is. */
  var FILTERS = [
    { id: 'all',       label: 'All' },
    { id: 'unread',    label: 'Unread' },
    { id: 'favorites', label: 'Favorites' }
  ];
  var UNREAD_STATES = ['unread', 'mention', 'reply', 'thread', 'ping',
                       'missed-call', 'muted-mention', 'muted-reply',
                       'incoming-request', 'onboarding'];
  var activeFilters = [];

  function hasFilter(id) { return activeFilters.indexOf(id) !== -1; }

  function toggleFilter(id) {
    var i = activeFilters.indexOf(id);
    if (i === -1) activeFilters.push(id);
    else          activeFilters.splice(i, 1);
  }

  function matchesFilter(c) {
    if (!activeFilters.length) return true;
    if (hasFilter('unread')    && UNREAD_STATES.indexOf(c.state) === -1) return false;
    if (hasFilter('favorites') && !c.favorite) return false;
    return true;
  }

  function emptyMessage() {
    if (hasFilter('unread') && hasFilter('favorites')) return 'Nothing matches these filters';
    if (hasFilter('favorites')) return 'No favorites';
    if (hasFilter('unread'))    return 'No unread conversations';
    return 'No conversations';
  }

  function syncFilterPills() {
    document.querySelectorAll('.filter-pill').forEach(function (b) {
      var on = b.dataset.filter === 'all' ? !activeFilters.length : hasFilter(b.dataset.filter);
      b.setAttribute('aria-pressed', on);
    });
  }

  function renderFilters() {
    var bar = document.getElementById('filter-bar');
    bar.innerHTML = FILTERS.map(function (f) {
      return '<button class="filter-pill" data-filter="' + f.id + '" '
           + 'aria-pressed="false" data-m3="FilterChip">' + f.label + '</button>';
    }).join('');
    syncFilterPills();

    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-pill');
      if (!btn) return;
      if (btn.dataset.filter === 'all') activeFilters = [];
      else                              toggleFilter(btn.dataset.filter);
      syncFilterPills();
      renderList();
    });
  }

  function sortRows(list) {
    var l = list.slice();
    if (sortBy === 'alphabet') l.sort(function (a, b) { return a.name.localeCompare(b.name); });
    else                       l.sort(function (a, b) { return b.activity - a.activity; });
    return l;
  }

  function renderList() {
    var list = document.getElementById('conv-list');
    var shown = sortRows(CONVERSATIONS.filter(matchesFilter));
    if (!shown.length) {
      list.innerHTML = '<li class="list-empty">' + emptyMessage() + '</li>';
      return;
    }
    if (groupBy === 'type') {
      list.innerHTML = BUCKETS.map(function (b) {
        var inBucket = shown.filter(function (c) { return c.kind === b.kind; });
        if (!inBucket.length) return '';
        return '<li class="section-label" role="presentation">' + b.label + '</li>'
             + inBucket.map(rowHtml).join('');
      }).join('');
      return;
    }
    list.innerHTML = shown.map(rowHtml).join('');
  }

  function rowHtml(c, i) {
    return [c].map(function (c, i) {
      var indicators = (c.verified  ? '<span class="ci-verified">'  + WDS.icon('verified',  { size: 14 }) + '</span>' : '')
                     + (c.legalHold ? '<span class="ci-legalhold">' + WDS.icon('legalhold', { size: 12 }) + '</span>' : '')
                     + (c.qualifier ? '<span class="ci-qualifier">' + c.qualifier + '</span>' : '');
      var body = '<div class="ci-line"><span class="ci-name">' + c.name + '</span>' + indicators + '</div>'
               + (c.sub ? '<div class="ci-sub">' + c.sub + '</div>' : '');
      return '<li class="conv-item" data-index="' + i + '" data-state="' + c.state + '" data-m3="ListItem">'
           +   '<div class="av">' + avatarFor(c) + '</div>'
           +   '<div class="ci-body">' + body + '</div>'
           +   '<div class="ci-trail">' + trailing(c) + '</div>'
           + '</li>';
    }).join('');
  }

  function bindListOnce() {
    var list = document.getElementById('conv-list');
    list.addEventListener('click', function (e) {
      var row = e.target.closest('.conv-item');
      if (!row) return;
      var name = row.querySelector('.ci-name').textContent;
      var conv = CONVERSATIONS.find(function (c) { return c.name === name; });
      if (conv) openConversation(conv);
    });
  }

  /* ── Navigation bar — order per the Design Vision mock ── */
  /* Only Conversations and Settings route anywhere yet. The others are
     drawn normally — they simply do nothing until their screens exist. */
  var DESTINATIONS = [
    { id: 'conversations', label: 'Conversations', ready: true },
    { id: 'drive',         label: 'Drive' },
    { id: 'meetings',      label: 'Meetings' },
    { id: 'settings',      label: 'Settings',      ready: true },
    { id: 'search',        label: 'Search' }
  ];

  function renderNav() {
    var nav = document.getElementById('nav-bar');
    nav.innerHTML = DESTINATIONS.map(function (d, i) {
      return '<button class="nav-item" role="tab" data-dest="' + d.id + '" '
           +   'aria-label="' + d.label + '" aria-selected="' + (i === 0) + '"'
           +   ' data-ready="' + (d.ready ? 'true' : 'false') + '" data-m3="NavigationBarItem">'
           +   '<span class="nav-pill">' + WDS.icon(d.id, { size: 24, active: i === 0 }) + '</span>'
           + '</button>';
    }).join('');

    nav.addEventListener('click', function (e) {
      var btn = e.target.closest('.nav-item');
      if (!btn) return;
      /* Search opens over whatever is on screen; the selected
         destination stays where it was. */
      if (btn.dataset.dest === 'search') { openSearch(); return; }
      if (btn.dataset.ready !== 'true') return;   // placeholder destination
      nav.querySelectorAll('.nav-item').forEach(function (b) {
        var on = b === btn;
        b.setAttribute('aria-selected', on);
        b.querySelector('.nav-pill').innerHTML = WDS.icon(b.dataset.dest, { size: 24, active: on });
      });
      var dest = btn.dataset.dest === 'settings' ? 'settings' : 'conversations';
      page.setAttribute('data-dest', dest);
      document.querySelector('.tb-title').textContent =
        dest === 'settings' ? 'Settings' : 'Conversations';
    });
  }

  function renderChrome() {
    document.getElementById('tb-avatar').innerHTML =
      personAvatar({ initials: 'KD', color: 'blue', presence: 'available' });
    document.getElementById('tb-overflow').innerHTML = WDS.icon('overflow', { size: 16 });
    document.getElementById('fab').innerHTML        = WDS.icon('compose',  { size: 20 });
    document.getElementById('search-icon').innerHTML = WDS.icon('search',   { size: 16 });
  }

  /* Routes the in-app Appearance controls. */
  function renderControls() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-theme-set],[data-accent-set],[data-mood-set]');
      if (!t) return;
      if (t.dataset.themeSet)  { themeIsUserChoice = true; setTheme(t.dataset.themeSet); }
      if (t.dataset.accentSet) setAccent(t.dataset.accentSet);
      if (t.dataset.moodSet)   applyMood(t.dataset.moodSet);
      syncAppearanceControls();
    });
  }

  if (typeof WDS === 'undefined') {
    document.querySelector('.app-surface').innerHTML =
      '<div style="padding:24px;font-size:13px;line-height:1.5;color:var(--wire-content-base-secondary)">'
      + '<strong style="color:var(--wire-content-danger-primary)">wds-icons.js did not load.</strong><br><br>'
      + 'This file expects <code>wds-tokens.css</code> and <code>wds-icons.js</code> to sit next to it '
      + 'under exactly those names. If your browser renamed them on download, use the standalone build instead.'
      + '</div>';
    return;
  }

  renderChrome();
  renderSettings();
  bindSettings();
  bindConversationView();
  bindSearch();
  bindDetails();
  bindKeyboard();
  renderMenu();
  bindMenu();
  renderFilters();
  renderList();
  bindListOnce();
  renderNav();
  renderControls();
  setTheme(systemTheme());
  watchSystemTheme();
  setAccent('blue');
  applyMood('mono');
})();
</script>
</body>
</html>
