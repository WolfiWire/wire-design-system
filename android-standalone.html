/* ═══════════════════════════════════════════════════════════════════
   WIRE DESIGN SYSTEM — CSS TOKENS
   Source: Wire Design System Figma (grkG8ylzSzIM0C1Nnaxn3l)
   Auto-resolved from Figma variable collections.
   Token naming: Figma path → CSS var (slashes → hyphens, lowercase)
   ═══════════════════════════════════════════════════════════════════ */

:root {

  /* ── IDENTITY TINTS — fixed avatar colors (not accent-dependent) ── */
  --wire-identity-blue:   #0667c8;  /* Light/Accent color/500 Blue   */
  --wire-identity-green:  #1d7833;  /* Light/Accent color/500 Green  */
  --wire-identity-amber:  #a25915;  /* Light/Accent color/500 Amber  */
  --wire-identity-petrol: #01718e;  /* Light/Accent color/500 Petrol */
  --wire-identity-purple: #8944ab;  /* Light/Accent color/500 Purple */
  --wire-identity-red:    #c20013;  /* Light/Accent color/500 Red    */

  /* Background mood — companion hues per accent (resolve through identity tokens, so they stay theme-correct) */
  --bg-hue: var(--wire-identity-blue);
  --bg-h2:  var(--wire-identity-petrol);
  --bg-h3:  var(--wire-identity-purple);
  --bg-h4:  var(--wire-identity-green);
  /* Fade-to base for the wallpaper: a soft, faintly accent-tinted off-white in light
     (never pure white); overridden to the deep base in dark mode below. */
  --bg-base: color-mix(in srgb, var(--bg-hue) 7%, var(--wire-bg-base-tertiary));

  /* ── CHANNEL AVATAR FILLS ── */
  --wire-channel-blue-bg:     #e7f0fa; --wire-channel-blue-border:   #cde1f4;
  --wire-channel-green-bg:    #e8f1ea; --wire-channel-green-border:  #d2e4d6;
  --wire-channel-amber-bg:    #f6eee8; --wire-channel-amber-border:  #ecded0;
  --wire-channel-petrol-bg:   #e5f1f3; --wire-channel-petrol-border: #cce2e7;
  --wire-channel-purple-bg:   #f4edf7; --wire-channel-purple-border: #e7daee;
  --wire-channel-red-bg:      #f9e6e8; --wire-channel-red-border:    #f3ccd0;
  /* ── SPACING (platform-independent) ─────────────────────────── */
  --spacing-0:  0px;
  --spacing-1:  4px;
  --spacing-2:  8px;
  --spacing-3:  12px;
  --spacing-4:  16px;
  --spacing-5:  20px;
  --spacing-6:  24px;
  --spacing-8:  32px;
  --spacing-10: 40px;
  --spacing-12: 48px;
  --spacing-16: 64px;
  --spacing-20: 80px;
  --spacing-24: 96px;

  /* ── RADIUS ──────────────────────────────────────────────────── */
  --radius-none: 0px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   10px;
  --radius-base: 12px;
  --radius-xl:   17px;
  --radius-2xl:  22px;
  --radius-full: 9999px;

  /* ── TYPOGRAPHY / INTER (WDS additions) ─────────────────────── */
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-weight-light:    300;
  --font-weight-regular:  400;
  --font-weight-medium:   500;
  --font-weight-semibold: 600;
  --font-weight-bold:     700;
  --font-size-xs:   12px;
  --font-size-sm:   13px;
  --font-size-base: 14px;
  --font-size-md:   16px;
  --font-size-lg:   18px;
  --font-size-xl:   20px;
  --line-height-xs:   16px;
  --line-height-sm:   18px;
  --line-height-base: 20px;
  --line-height-md:   24px;

  /* ── THEME TOKENS — LIGHT MODE (default) ─────────────────────
     CSS var naming: --wire-{group}-{subgroup}-{variant}
     Maps 1:1 to Figma Theme collection token names.
     ───────────────────────────────────────────────────────────── */

  /* Background / Base */
  --wire-bg-base-primary:           #ffffff;
  --wire-bg-base-primary-focus:     #fafafa;
  --wire-bg-base-secondary:         #fafafa;
  --wire-bg-base-secondary-focus:   #e5e8ea;
  --wire-bg-base-tertiary:          #edeff0;
  --wire-bg-base-tertiary-focus:    #dce0e3;

  /* Background / Accent Color — Blue (default, overridden by data-accent) */
  --wire-bg-accent-primary:         #0667c8;
  --wire-bg-accent-primary-focus:   #043e78;
  --wire-bg-accent-secondary:       #e7f0fa;
  --wire-bg-accent-secondary-focus: #cde1f4;

  /* Background / Danger */
  --wire-bg-danger-primary:         #c20013;
  --wire-bg-danger-primary-focus:   #74000b;
  --wire-bg-danger-secondary:       #f9e6e8;
  --wire-bg-danger-secondary-focus: #f3ccd0;

  /* Background / Warning */

  --wire-bg-warning-primary-focus:  #61350d;
  --wire-bg-warning-secondary:      #f6eee8;

  /* Background / Positive */
  --wire-bg-positive-primary:       #1d7833;
  --wire-bg-positive-primary-focus: #11481f;
  --wire-bg-positive-secondary:     #e8f1ea;

  /* Background / Neutral */
  --wire-bg-neutral-primary:        #dce0e3;
  --wire-bg-neutral-secondary:      #ffffff;

  /* Background / Disabled */
  --wire-bg-disabled-primary:       #cbced1;
  --wire-bg-disabled-secondary:     #edeff0;

  /* Background / Inverted */
  --wire-bg-inverted-primary:       #17181a;
  --wire-bg-inverted-primary-focus: #54585f;
  --wire-bg-inverted-secondary:     #17181a;

  /* Background / Backdrop */

  /* Background / Sheet */
  --wire-bg-sheet-primary:          #edeff0;
  --wire-bg-sheet-secondary:        #ffffff;

  /* Background / Bubbles */

  --wire-bg-bubbles-own-primary-focus:  #043e78;
  --wire-bg-bubbles-own-secondary:      #0552a0;

  --wire-bg-bubbles-others-primary-focus:   #dce0e3;  /* Gray/040 */
  --wire-bg-bubbles-others-secondary:       #ffffff;  /* White/100 */
  --wire-bg-bubbles-others-secondary-focus: #fafafa;  /* Gray/010 */

  /* Content / Base */

  --wire-content-base-secondary:    #676b71;

  /* Content / Accent Color */
  --wire-content-accent-primary:    #0667c8;
  --wire-content-accent-on-primary: #ffffff;
  --wire-content-accent-on-secondary: #0667c8;

  /* Content / Danger */
  --wire-content-danger-primary:    #c20013;
  --wire-content-danger-on-primary: #ffffff;
  --wire-content-danger-on-secondary: #c20013;

  /* Content / Warning */
  --wire-content-warning-primary:   #a25915;
  --wire-content-warning-on-primary: #ffffff;

  /* Content / Positive */
  --wire-content-positive-primary:  #1d7833;
  --wire-content-positive-on-primary: #ffffff;

  /* Content / Neutral */
  --wire-content-neutral-on-primary:   #17181a;
  --wire-content-neutral-on-secondary: #17181a;

  /* Content / Disabled */
  --wire-content-disabled-primary:    #676b71;
  --wire-content-disabled-on-primary: #54585f;

  /* Content / Inverted */
  --wire-content-inverted-on-primary: #ffffff;

  /* Content / Bubbles */

  --wire-content-bubbles-own-on-primary:  #cde1f4;
  --wire-content-bubbles-own-on-secondary:#9bc2e9;

  /* Border / Base */
  --wire-border-base-primary:         #dce0e3;
  --wire-border-base-secondary:       #ffffff;
  --wire-border-base-focus:           #6aa4de;

  /* Border / Accent Color */
  --wire-border-accent-primary:       #0667c8;
  --wire-border-accent-secondary:     #cde1f4;
  --wire-border-accent-focus:         #6aa4de;

  /* Border / Danger */
  --wire-border-danger-primary:       #c20013;
  --wire-border-danger-secondary:     #f3ccd0;
  --wire-border-danger-focus:         #da6671;

  /* Border / Warning */
  --wire-border-warning-primary:      #a25915;

  /* Border / Positive */
  --wire-border-positive-primary:     #1d7833;

  /* Border / Neutral */
  --wire-border-neutral-primary:      #676b71;
  --wire-border-neutral-secondary:    #dce0e3;

  /* Border / Disabled */
  --wire-border-disabled-primary:     #dce0e3;

  /* Border / Inverted */
  --wire-border-inverted-primary:     #ffffff;

  /* ── ACCENT COLOR RAMPS — Blue (default) ────────────────────── */
  --wire-accent-050: #e7f0fa;
  --wire-accent-100: #cde1f4;
  --wire-accent-200: #9bc2e9;
  --wire-accent-300: #6aa4de;
  --wire-accent-400: #3885d3;
  --wire-accent-500: #0667c8;
  --wire-accent-600: #0552a0;
  --wire-accent-700: #043e78;
  --wire-accent-800: #022950;
  --wire-accent-900: #021f3c;

  /* Plain Colors — imported from Wire Design System (Theme collection) · light */
  --wire-plain-purple-primary:#8944ab; --wire-plain-purple-primary-focus:#6e3689; --wire-plain-purple-secondary:#f4edf7; --wire-plain-purple-secondary-focus:#e7daee;
  --wire-plain-blue-primary:#0667c8;   --wire-plain-blue-primary-focus:#0552a0;   --wire-plain-blue-secondary:#e7f0fa;   --wire-plain-blue-secondary-focus:#cde1f4;
  --wire-plain-amber-primary:#a25915;  --wire-plain-amber-primary-focus:#824711;  --wire-plain-amber-secondary:#f6eee8;  --wire-plain-amber-secondary-focus:#ecded0;
  --wire-plain-green-primary:#1d7833;  --wire-plain-green-primary-focus:#176029;  --wire-plain-green-secondary:#e8f1ea;  --wire-plain-green-secondary-focus:#d2e4d6;
  --wire-plain-red-primary:#c20013;    --wire-plain-red-primary-focus:#9b000f;    --wire-plain-red-secondary:#f9e6e8;    --wire-plain-red-secondary-focus:#f3ccd0;
  --wire-plain-petrol-primary:#01718e; --wire-plain-petrol-primary-focus:#015a6e; --wire-plain-petrol-secondary:#e5f1f3; --wire-plain-petrol-secondary-focus:#cce2e7;
  --wire-plain-gray-primary:#54585f;   --wire-plain-gray-primary-focus:#34373d;   --wire-plain-gray-secondary:#e5e8ea;   --wire-plain-gray-secondary-focus:#dce0e3;

/* ── Background moods ─────────────────────────────────────────────────
   The app window covers the centre of the screen, so the wallpaper is only
   seen in the outer frame: the top band (where the global search floats) and
   the left column (where the nav rail sits). These #page rules therefore
   concentrate colour along the top and left edges — richest at the top-left
   corner — and fade into the covered centre. Hue comes from the current accent
   (--bg-hue/-h2/-h3/-h4, theme-correct); lightness mixes toward --bg-base
   (soft accent-tinted off-white in light, deep base in dark).

}
.tb-action {
  position: absolute; right: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 12px; border-radius: 12px;
  background: none; border: 0; cursor: pointer;
  color: var(--chrome-fg);
}
.tb-action:active { background: color-mix(in srgb, var(--chrome-fg) 12%, transparent); }

/* ─── APP SURFACE ──────────────────────────────────────────────────
   Opaque sheet on top of the wallpaper. Rounded top corners only;
   runs underneath the navigation bar so the list scrolls behind it. */
.app-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -ms-overflow-style: none; scrollbar-width: none;
}
.app-scroll::-webkit-scrollbar { display: none; }
.app-surface {
  background: var(--wire-bg-base-primary);
  min-height: calc(100% - 48px);   /* search bar 40 + 8 gap below it */
  /* Square top edge — the surface meets the title bar flush. */
  overflow: hidden;
}
.conv-list { list-style: none; margin: 0; padding: 0 0 60px; }

/* The conversation list has no search bar: the surface reclaims the
   band it occupied and the Search destination in the navigation bar is
   the way in. */
html.hide-list-search .search-bar { display: none; }
html.hide-list-search .app-surface { min-height: 100%; }


/* ─── SEARCH BAR ───────────────────────────────────────────────────
   344x40 at y86. Fully rounded per M3 SearchBar (supersedes the mock's
   radius 12). Expands into the full-screen search view. */
.search-bar {
  flex-shrink: 0; height: 40px; margin: 0 8px 8px;
  display: flex; align-items: center; padding-left: 4px;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 1000px; cursor: pointer;
}
.search-bar:active { background: var(--wire-bg-base-primary-focus); }
.search-icon {
  width: 40px; height: 32px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-base-primary);
}
.search-placeholder {
  flex: 1; text-align: center;
  font-size: 14px; font-weight: 400; line-height: 18px;
  color: var(--wire-content-base-secondary);
}
.search-spacer { width: 40px; flex-shrink: 0; }

/* ─── OVERFLOW MENU ────────────────────────────────────────────────
   M3 menu (48dp items, elevation 2) carrying the desktop filter menu's
   systematic: labelled sections, radio options with a trailing check,
   and options whose feature isn't built shown but not selectable. */
.menu {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 60;
  min-width: 224px; padding: 8px 0;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 12px;
  box-shadow: 0 6px 20px -6px rgba(0,0,0,0.30), 0 2px 6px rgba(0,0,0,0.12);
  display: none; flex-direction: column;
  text-align: left;
}
.menu.open { display: flex; }
.menu-label {
  padding: 8px 16px 4px;
  font-size: 12px; font-weight: 400; line-height: 16px;
  color: var(--wire-content-base-secondary);
}
.menu-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; box-sizing: border-box;
  min-height: 48px; padding: 8px 16px;
  border: 0; background: none; cursor: pointer; text-align: left;
  font: inherit; font-size: 16px; font-weight: 400; line-height: 24px;
  color: var(--wire-content-base-primary);
}
.menu-opt:active { background: var(--wire-bg-base-tertiary); }
.menu-opt[aria-checked="true"] { font-weight: 500; }
.menu-opt .menu-check { opacity: 0; color: var(--wire-content-accent-primary); flex-shrink: 0; }
.menu-opt[aria-checked="true"] .menu-check { opacity: 1; }
.menu-opt[aria-disabled="true"] { color: var(--wire-content-base-secondary); opacity: 0.55; cursor: default; }
.menu-opt[aria-disabled="true"]:active { background: none; }
.menu-sep { height: 1px; margin: 8px 0; background: var(--wire-border-base-primary); }

/* ─── LIST SECTION HEADING (Group by → Message types) ──────────────*/
.section-label {
  padding: 12px 16px 4px;
  font-size: 14px; font-weight: 500; line-height: 18px;
  color: var(--wire-content-base-secondary);
  background: var(--wire-bg-base-primary);
}

/* ═══ SETTINGS ══════════════════════════════════════════════════════
   M3 grouped list. Same three groups and the same ten entries as the
   desktop settings modal; only Appearance has content there, so only
   Appearance has content here. */
#page[data-dest="settings"] #list-stack,
#page[data-dest="settings"] .fab,
#page[data-dest="settings"] .tb-action { display: none; }
#page[data-dest="conversations"] #settings-stack { display: none; }

#settings-stack { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 8px; }
.settings-surface {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  background: var(--wire-bg-base-primary);
  border-radius: 16px 16px 0 0;
  -ms-overflow-style: none; scrollbar-width: none;
}
.settings-surface::-webkit-scrollbar { display: none; }
.settings-list { list-style: none; margin: 0; padding: 0 0 68px; }
.settings-group {
  padding: 16px 16px 4px;
  font-size: 14px; font-weight: 500; line-height: 18px;
  color: var(--wire-content-base-secondary);
}
.settings-item {
  display: flex; align-items: center; gap: 16px;
  min-height: 56px; padding: 8px 16px; width: 100%; box-sizing: border-box;
  border: 0; background: none; cursor: pointer; text-align: left;
  font: inherit; font-size: 16px; line-height: 24px;
  color: var(--wire-content-base-primary);
  border-bottom: 1px solid var(--wire-border-base-primary);
}
.settings-item:active { background: var(--wire-bg-base-tertiary); }
.settings-item .lead { color: var(--wire-content-base-secondary); flex-shrink: 0; }
.settings-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-item .chev { color: var(--wire-content-base-secondary); flex-shrink: 0; }

/* ─── Settings detail (pushed, same transition as a conversation) ───*/
#settings-detail {
  position: absolute; inset: 0; z-index: 45;
  display: flex; flex-direction: column;
  background: var(--wire-bg-base-primary);
  transform: translateX(100%); visibility: hidden;
  transition: transform .22s cubic-bezier(.2, 0, 0, 1), visibility .22s;
}
#settings-detail.open { transform: translateX(0); visibility: visible; }
.sd-scroll { flex: 1; min-height: 0; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
.sd-scroll::-webkit-scrollbar { display: none; }
.sd-row {
  padding: 16px; border-bottom: 1px solid var(--wire-border-base-primary);
  display: flex; flex-direction: column; gap: 8px;
}
.sd-row.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; }
.sd-label { font-size: 14px; font-weight: 500; line-height: 18px; color: var(--wire-content-base-secondary); }
.sd-value { font-size: 16px; line-height: 24px; color: var(--wire-content-base-primary); }
.sd-hint  { font-size: 12px; line-height: 16px; color: var(--wire-content-base-secondary); }
.sd-profile { display: flex; align-items: center; gap: 16px; }
.sd-avatar { width: 64px; height: 64px; flex-shrink: 0; }
.sd-avatar .av-person { font-size: 22px; }
.sd-btn {
  border: 1px solid var(--wire-border-base-primary); background: var(--wire-bg-base-primary);
  color: var(--wire-content-base-primary); font: inherit; font-size: 14px; font-weight: 500;
  padding: 8px 14px; border-radius: 1000px; cursor: pointer;
}
/* M3 exposed dropdown menu — spec: Android / 52568:111015.
   Field 49dp, radius 12, 15/16 padding; menu matches its width. */
.sd-dropdown { position: relative; }
.sd-dd-field {
  width: 100%; height: 49px; box-sizing: border-box;
  display: flex; align-items: center; gap: 12px;
  padding: 15px 16px; border-radius: 12px; cursor: pointer;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  font: inherit; font-size: 15px; line-height: 19px;
  color: var(--wire-content-base-primary);
}
.sd-dd-swatch {
  width: 20px; height: 20px; border-radius: 1000px; flex-shrink: 0;
  box-shadow: 0 0 0 1px var(--wire-border-base-primary) inset;
}
.sd-dd-label { flex: 1; min-width: 0; text-align: left; }
.sd-dd-chev { flex-shrink: 0; color: var(--wire-content-base-secondary); transform: rotate(90deg); }
.sd-dd-field[aria-expanded="true"] .sd-dd-chev { transform: rotate(-90deg); }
.sd-dd-menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
  margin: 0; padding: 4px 0; list-style: none;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 12px;
  box-shadow: 0 6px 20px -6px rgba(0,0,0,0.30), 0 2px 6px rgba(0,0,0,0.12);
  display: none; max-height: 260px; overflow-y: auto;
}
.sd-dd-menu.open { display: block; }
.sd-dd-opt {
  width: 100%; box-sizing: border-box;
  display: flex; align-items: center; gap: 12px;
  min-height: 48px; padding: 8px 16px;
  border: 0; background: none; cursor: pointer; text-align: left;
  font: inherit; font-size: 16px; line-height: 24px;
  color: var(--wire-content-base-primary);
}
.sd-dd-opt:active { background: var(--wire-bg-base-tertiary); }
.sd-dd-opt[aria-selected="true"] { font-weight: 500; }
.sd-dd-opt .tick { margin-left: auto; opacity: 0; color: var(--wire-content-accent-primary); }
.sd-dd-opt[aria-selected="true"] .tick { opacity: 1; }

/* Example preview — real bubble components, so the accent change is
   visible the moment it is picked. */
.sd-preview {
  padding: 12px 0; border-radius: 12px;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
}
.sd-preview .msg-row { padding-left: 12px; padding-right: 12px; }
.sd-preview .msg-row.own { padding-left: 60px; }
.sd-preview .msg-row.other { padding-right: 60px; padding-left: 0; }

/* Segmented buttons — M3. Theme (2 options) sits inline on the right;
   Background (5) needs the full width, so it wraps under its label. */
.sd-row.inline .sd-segment { flex: 0 0 auto; }
.sd-seg-group {
  display: flex; width: 100%;
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 1000px; overflow: hidden;
}
.sd-row.inline .sd-seg-group { width: auto; }
.sd-seg-group .sd-seg-btn {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 0;
  padding: 8px 4px; font-size: 12px; line-height: 18px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--wire-bg-base-primary);
}
/* Theme has only two segments and sits inline, so its buttons size to
   their label instead of sharing a fixed track. */
.sd-row.inline .sd-seg-group { flex: 0 0 auto; width: auto; }
.sd-row.inline .sd-seg-group .sd-seg-btn {
  flex: 0 0 auto; width: auto; padding: 8px 16px; font-size: 13px;
  overflow: visible; text-overflow: clip;
}
.sd-seg-group .sd-seg-btn + .sd-seg-btn { border-left: 1px solid var(--wire-border-base-primary); }
.sd-seg-group .sd-seg-btn[aria-pressed="true"] {
  background: var(--wire-bg-accent-secondary);
  color: var(--wire-content-accent-primary); font-weight: 600;
}

/* Live previews — abstract wireframes (spec: 375:15302 / 375:15358),
   92x176 each, side by side. They resolve the same tokens as the app,
   so theme, accent and background changes show up immediately. */
.sd-previews { display: flex; gap: 12px; width: 100%; }
.sd-prev-wrap { flex: 1 1 0; min-width: 0; }
.sd-prev {
  width: 100%; aspect-ratio: 92 / 176; border-radius: 8px; overflow: hidden;
  position: relative; border: 1px solid var(--wire-border-base-primary);
}
.pv-bar   { position: absolute; border-radius: 3px; background: var(--wire-bg-base-tertiary); }
.pv-surface { position: absolute; left: 0; right: 0; background: var(--wire-bg-base-primary); }
.pv-row   { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-bottom: 1px solid var(--wire-border-base-primary); }
.pv-dot   { width: 11px; height: 11px; border-radius: 1000px; flex-shrink: 0; }
.pv-line  { height: 8px; border-radius: 3px; background: var(--wire-bg-base-tertiary); }
.pv-fab   { position: absolute; right: 8px; bottom: 10px; width: 18px; height: 18px; border-radius: 6px; background: var(--wire-bg-accent-primary); }
.pv-bubble-own   { margin: 5px 6px 0 auto; width: 52%; height: 24px; border-radius: 8px; background: var(--wire-bg-bubbles-own-primary); }
.pv-bubble-other { margin: 5px auto 0 6px; width: 62%; height: 30px; border-radius: 8px; background: var(--wire-bg-bubbles-others-primary); }
.pv-composer { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: var(--wire-bg-base-primary); border-top: 1px solid var(--wire-border-base-primary); }
.pv-header { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: var(--wire-bg-base-primary); border-bottom: 1px solid var(--wire-border-base-primary); }

.sd-swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sd-swatch {
  width: 32px; height: 32px; border-radius: 1000px; padding: 0; cursor: pointer;
  border: 2px solid transparent; box-shadow: 0 0 0 1px var(--wire-border-base-primary) inset;
}
.sd-swatch[aria-pressed="true"] { border-color: var(--wire-content-base-primary); }
.sd-segment { display: flex; gap: 8px; }
.sd-seg-btn {
  flex: 1; padding: 10px 12px; border-radius: 1000px; cursor: pointer;
  border: 1px solid var(--wire-border-base-primary);
  background: var(--wire-bg-base-primary); color: var(--wire-content-base-primary);
  font: inherit; font-size: 14px; font-weight: 400;
}
.sd-seg-btn[aria-pressed="true"] {
  background: var(--wire-bg-accent-secondary);
  border-color: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-primary); font-weight: 700;
}
.sd-empty { padding: 40px 24px; text-align: center; font-size: 14px; color: var(--wire-content-base-secondary); }

/* ═══ CONVERSATION DETAILS ══════════════════════════════════════════
   Spec: Android / 39692:272100 (admin view) + 41404:135351
   (participants list). Reached by pressing the conversation title in
   the conversation header. The hero and action buttons scroll with the
   content; the tab bar sticks once it reaches the page header. */
#conv-details {
  position: absolute; inset: 0; z-index: 46;
  display: flex; flex-direction: column;
  /* Sheet tokens: primary is the surface the screen sits on, secondary
     is every item resting on it. */
  background: var(--wire-bg-sheet-primary);
  /* M3 full-screen dialog: rises over the conversation and fades in,
     rather than pushing in from the side. Dismissed with the X. */
  transform: translateY(100%); opacity: 0; visibility: hidden;
  transition: transform .24s cubic-bezier(.2, 0, 0, 1),
              opacity .18s cubic-bezier(.2, 0, 0, 1),
              visibility .24s;
}
#conv-details.open { transform: translateY(0); opacity: 1; visibility: visible; }
#conv-details .cv-header { background: var(--wire-bg-sheet-primary); border-bottom: 0; }

.cd-scroll {
  flex: 1; min-height: 0; overflow-y: auto;
  -ms-overflow-style: none; scrollbar-width: none;
}
.cd-scroll::-webkit-scrollbar { display: none; }

/* Hero — 64dp avatar, name, participant count. */
.cd-hero {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0 16px;
}
.cd-hero .av { width: 64px; height: 64px; }
.cd-hero .av-person { font-size: 22px; }
.cd-hero .av-group, .cd-hero .av-channel { border-radius: 10px; border-width: 2px; }
.cd-name {
  margin-top: 4px; width: 100%; text-align: center;
  font-size: 15px; font-weight: 500; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary); word-break: break-word;
}
.cd-participants {
  width: 100%; text-align: center;
  font-size: 12px; font-weight: 400; line-height: 14px;
  color: var(--wire-content-base-secondary);
}

/* Action row — Search / Media. 48dp, corner 16, surface with outline. */
.cd-actions { display: flex; gap: 8px; padding: 24px 16px 0; }
.cd-action {
  flex: 1 0 0; min-width: 0; height: 48px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 16px; cursor: pointer; padding: 0;
  font: inherit; font-size: 15px; font-weight: 500; line-height: 17px;
  color: var(--wire-content-base-primary);
}
.cd-action:active { background: var(--wire-bg-base-primary-focus); }

/* Material 3 secondary tabs — 48dp row, Title Small labels in sentence
   case, a 2dp active indicator spanning the full tab, and a 1dp divider
   across the row. Sticky. */
.cd-tabs {
  position: sticky; top: 0; z-index: 2; margin-top: 24px;
  display: flex; background: var(--wire-bg-sheet-primary);
  box-shadow: inset 0 -1px 0 var(--wire-border-base-primary);
}
.cd-tab {
  position: relative;
  flex: 1 0 0; min-width: 0; height: 48px; padding: 0 16px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 20px;
  color: var(--wire-content-base-secondary);
}
.cd-tab:active { background: color-mix(in srgb, var(--wire-content-base-primary) 8%, transparent); }
.cd-tab[aria-selected="true"] { color: var(--wire-content-accent-primary); }
.cd-tab-label {
  display: inline-block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
/* Active indicator — full width of the tab item, sitting on the divider. */
.cd-tab[aria-selected="true"]::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--wire-bg-accent-primary);
}

/* Section label — same component as the Options and Participants heads. */
.cd-title {
  height: 24px; display: flex; align-items: center; padding: 0 16px;
  background: var(--wire-bg-sheet-primary);
  font-size: 12px; font-weight: 500; line-height: 14px;
  letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--wire-content-base-secondary);
}

/* Data row — label over value, trailing chevron. */
.cd-data {
  position: relative; padding: 16px 40px 16px 16px;
  background: var(--wire-bg-sheet-secondary);
  border-bottom: 1px solid var(--wire-border-base-primary);
  display: flex; flex-direction: column; gap: 4px; cursor: pointer;
}
.cd-data:active { background: var(--wire-bg-base-primary-focus); }
.cd-data-label {
  font-size: 12px; font-weight: 400; line-height: 14px;
  letter-spacing: 0.25px; text-transform: uppercase;
  color: var(--wire-content-base-secondary);
}
.cd-data-value {
  font-size: 15px; font-weight: 500; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary);
}
.cd-chevron {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  color: var(--wire-content-base-secondary);
}

/* Setting row — title, state, switch, description. */
.cd-setting {
  padding: 12px 12px 12px 16px;
  background: var(--wire-bg-sheet-secondary);
  border-bottom: 1px solid var(--wire-border-base-primary);
  display: flex; flex-direction: column; gap: 8px;
}
.cd-setting-head { display: flex; align-items: center; gap: 8px; }
.cd-setting-name {
  flex: 1 0 0; min-width: 0;
  font-size: 15px; font-weight: 500; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary);
}
.cd-setting-state {
  font-size: 15px; font-weight: 400; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary);
}
.cd-setting-desc {
  font-size: 15px; font-weight: 400; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-secondary);
}

/* M3 Switch — 52x32 track, 16dp thumb off / 24dp on. The mock still
   draws the legacy 48x24 Wire toggle; Material 3 is the brief. */
.m3-switch {
  position: relative; width: 52px; height: 32px; flex-shrink: 0;
  box-sizing: border-box; padding: 0; cursor: pointer;
  border-radius: 16px;
  background: var(--wire-bg-base-tertiary);
  border: 2px solid var(--wire-border-base-secondary);
  transition: background .15s, border-color .15s;
}
.m3-switch[aria-checked="true"] {
  background: var(--wire-bg-accent-primary);
  border-color: var(--wire-bg-accent-primary);
}
.m3-switch-thumb {
  position: absolute; top: 50%; left: 6px;
  width: 16px; height: 16px; border-radius: 100px;
  background: var(--wire-content-base-secondary);
  transform: translateY(-50%);
  transition: left .15s, width .15s, height .15s, background .15s;
}
.m3-switch[aria-checked="true"] .m3-switch-thumb {
  left: 22px; width: 24px; height: 24px;
  background: var(--wire-content-accent-on-primary);
}

/* Participants tab — intro block and filled action. */
.cd-part-intro {
  padding: 16px; background: var(--wire-bg-sheet-secondary);
  font-size: 15px; font-weight: 400; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary);
}
.cd-part-intro b { font-weight: 500; }
.cd-panel { padding-bottom: 32px; }
/* Clear the floating action button: 24 offset + 48 button + 16 breathing. */
.cd-panel[data-tab="participants"] { padding-bottom: 88px; }

/* No navigation bar on this screen, so the FAB sits in the corner. */
#cd-fab { right: 24px; bottom: 24px; display: none; }
#cd-fab i { font-size: 20px; }
#cd-fab.show { display: flex; }
.cd-panel .conv-item:first-child { border-top: 0; }
.cd-panel .conv-item { background: var(--wire-bg-sheet-secondary); }
.cd-panel .conv-item:active {
  background: color-mix(in srgb, var(--wire-content-base-primary) 8%, var(--wire-bg-sheet-secondary));
}
/* The action buttons rest on the sheet too. */
.cd-action { background: var(--wire-bg-sheet-secondary); }

/* ═══ MESSAGE RESULT ROW ════════════════════════════════════════════
   Spec: Android / 39692:274163. Used by the global search for message
   hits, whether the search is scoped to one conversation or not. */
.cs-row {
  display: flex; align-items: flex-start; gap: 16px;
  padding: 12px 16px 12px 8px; cursor: pointer;
}
.cs-row:active { background: var(--wire-bg-base-primary-focus); }
.cs-in { font-weight: 400; color: var(--wire-content-base-secondary); }
.cs-row .av { width: 32px; height: 32px; }
.cs-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cs-head { display: flex; align-items: center; gap: 6px; }
.cs-sender {
  font-size: 14px; font-weight: 700; line-height: 19px; letter-spacing: 0.35px;
  color: var(--wire-content-base-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cs-time {
  margin-left: auto; flex-shrink: 0;
  font-size: 11px; font-weight: 500; line-height: 12px; letter-spacing: 0.5px;
  color: var(--wire-content-base-secondary);
}
.cs-snippet {
  font-size: 15px; font-weight: 400; line-height: 19px; letter-spacing: 0.05px;
  color: var(--wire-content-base-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* Matches are marked by weight, per the Figma spec — no highlight fill. */
.hit-body { font-weight: 500; }
.hit-name { font-weight: 700; }

/* The conversation title opens the details screen. */
.cv-title { cursor: pointer; }

/* ═══ GLOBAL SEARCH ═════════════════════════════════════════════════
   M3 full-screen search view. No Android mock exists yet, so this is
   built to the M3 search spec with WDS tokens, functionally matched to
   the desktop prototype: the same entity index (conversations + every
   message with text), the same filters minus Files, the same match
   highlighting. Two entry points — the docked bar in the list and the
   Search item in the navigation bar. Opening it leaves the selected
   navigation destination untouched. */
#search-view {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background: var(--wire-bg-base-primary);
  opacity: 0; visibility: hidden; transform: scale(1.02);
  transition: opacity .18s cubic-bezier(.2, 0, 0, 1),
              transform .18s cubic-bezier(.2, 0, 0, 1),
              visibility .18s;
}
#search-view.open { opacity: 1; visibility: visible; transform: none; }

.sv-header { flex-shrink: 0; padding: 8px; }

/* M3 SearchView docked field — 48dp, fully rounded, leading back,
   trailing clear. Same corner treatment as the docked bar it grew from. */
.sv-bar {
  height: 48px; margin-top: 8px; box-sizing: border-box;
  display: flex; align-items: center; gap: 4px; padding: 0 4px;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  border-radius: 1000px;
  transition: border-color .12s, background .12s;
}
/* Active — the field is focused the moment the view opens, so this is
   the resting appearance rather than an exception. */
.sv-bar:focus-within {
  border-color: var(--wire-border-accent-primary);
  background: var(--wire-bg-base-primary-focus);
}
.sv-icon-btn {
  width: 40px; height: 40px; flex-shrink: 0; padding: 0; border: 0;
  border-radius: 1000px; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-base-primary);
}
.sv-icon-btn:active { background: var(--wire-bg-base-primary-focus); }
.sv-input {
  flex: 1; min-width: 0; border: 0; outline: none; background: none;
  font: inherit; font-size: 16px; font-weight: 400; line-height: 24px;
  color: var(--wire-content-base-primary);
  caret-color: var(--wire-content-accent-primary);
}
.sv-input::placeholder { color: var(--wire-content-base-secondary); }

/* Scope chip — narrows the search to one conversation, the way the
   desktop prototype does. Removing it searches everywhere again. */
.sv-scope {
  flex-shrink: 0; max-width: 45%; height: 28px; box-sizing: border-box;
  display: flex; align-items: center; gap: 2px; padding: 0 2px 0 10px;
  border-radius: 1000px; background: var(--wire-bg-accent-secondary);
  font-size: 13px; font-weight: 500; line-height: 16px;
  color: var(--wire-content-accent-on-secondary);
}
.sv-scope-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sv-scope-clear {
  flex-shrink: 0; width: 24px; height: 24px; padding: 0; border: 0;
  background: none; border-radius: 1000px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-accent-on-secondary);
}

/* Filter chips — the desktop tab set minus Files, on the list's own
   .filter-pill component. Horizontally scrollable, single select. */
.sv-chips {
  flex-shrink: 0; display: flex; gap: 8px; padding: 0 16px 8px;
  overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
}
.sv-chips::-webkit-scrollbar { display: none; }
.sv-count { margin-left: 6px; font-weight: 400; opacity: .6; }

/* File tile — sits in the row's avatar slot, tinted by file type. */
.sv-file-ic {
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-base-secondary);
  border: 1px solid var(--wire-border-base-primary);
}
.sv-file-ic i { font-size: 16px; }

.sv-results {
  flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px;
  -ms-overflow-style: none; scrollbar-width: none;
}
.sv-results::-webkit-scrollbar { display: none; }
.sv-results .section-label { background: var(--wire-bg-base-primary); }

/* Message hits reuse .conv-item, relaxed to two snippet lines. */
.conv-item.sv-msg { height: auto; min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
.sv-in { font-weight: 400; color: var(--wire-content-base-secondary); }
.sv-snippet {
  font-size: 14px; font-weight: 400; line-height: 18px;
  color: var(--wire-content-base-secondary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: normal;
}
/* Matches are marked by weight, matching the search-in-conversation spec. */
.sv-empty {
  padding: 48px 32px; text-align: center;
  font-size: 14px; font-weight: 400; line-height: 20px;
  color: var(--wire-content-base-secondary);
}

/* ─── ANDROID KEYBOARD ──────────────────────────────────────────────
   Gboard's layout and proportions on a 360dp phone — suggestion strip
   plus four rows — drawn in WDS tokens so it themes with everything
   else. The keys type into the search field, so the prototype can be
   driven by touch alone. */
.kb {
  flex-shrink: 0; user-select: none;
  padding: 0 4px 8px;
  background: var(--wire-bg-base-tertiary);
  border-top: 1px solid var(--wire-border-base-primary);
}
.kb-suggest {
  height: 44px; display: flex; align-items: center;
  color: var(--wire-content-base-primary);
}
.kb-suggest span {
  flex: 1; text-align: center; font-size: 14px; line-height: 18px;
  border-right: 1px solid var(--wire-border-base-primary);
}
.kb-suggest span:last-child { border-right: 0; }
.kb-row { display: flex; gap: 5px; margin-bottom: 7px; }
.kb-row:last-child { margin-bottom: 0; }
.kb-key {
  flex: 1 0 0; height: 42px; min-width: 0; padding: 0; border: 0;
  border-radius: 6px; cursor: pointer;
  font: inherit; font-size: 16px; font-weight: 400; line-height: 42px;
  background: var(--wire-bg-base-primary);
  color: var(--wire-content-base-primary);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
}
.kb-key:active { background: var(--wire-bg-base-primary-focus); }
.kb-key.mod {                            /* shift, backspace, ?123 */
  background: var(--wire-bg-base-tertiary-focus); font-size: 14px;
}
.kb-key.action {                         /* the search / enter key */
  background: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
}
.kb-key.wide  { flex: 1.5 0 0; }
.kb-key.space { flex: 5 0 0; }
.kb-spacer    { flex: 0.5 0 0; }

/* ═══ CONVERSATION VIEW ═════════════════════════════════════════════
   Spec: Android / 50940:84197. Pushes over the list the way an Android
   screen transition does; back returns. Header 86, composer 56. */
#conv-view {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column;
  background: var(--wire-bg-base-primary);
  transform: translateX(100%); visibility: hidden;
  transition: transform .22s cubic-bezier(.2, 0, 0, 1), visibility .22s;
}
#conv-view.open { transform: translateX(0); visibility: visible; }

.cv-header {
  flex-shrink: 0; height: 86px; padding: 8px;
  background: var(--wire-bg-base-primary);
  border-bottom: 1px solid var(--wire-border-base-primary);
}
.cv-titlebar { height: 56px; padding: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.cv-back, .cv-action {
  width: 40px; height: 32px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--wire-content-base-primary);
}
/* Ghost, not outlined — the pressed state carries the affordance. */
.cv-back:active, .cv-action:active {
  background: color-mix(in srgb, var(--wire-content-base-primary) 10%, transparent);
}
.cv-action .wds-ic[data-icon="videocall"] { width: 20px !important; height: 16px !important; }
.cv-avatar { position: relative; width: 24px; height: 24px; flex-shrink: 0; }
.cv-title { flex: 1; min-width: 0; display: flex; align-items: center; }
.cv-title-text {
  font-size: 18px; font-weight: 500; line-height: 23px;
  color: var(--wire-content-base-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cv-title-chevron { flex-shrink: 0; color: var(--wire-content-base-secondary); }

.cv-scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  -ms-overflow-style: none; scrollbar-width: none;
}
.cv-scroll::-webkit-scrollbar { display: none; }

/* ─── Bubbles ──────────────────────────────────────────────────────
   Own: right aligned, accent fill, left inset 80. Others: left
   aligned, tertiary fill, right inset 80. Group adds a 40dp avatar
   gutter and a sender name on the first bubble of a run. */
.msg-row { display: flex; padding: 1px 16px; }
.msg-row.own   { justify-content: flex-end;   padding-left: 80px; }
.msg-row.other { justify-content: flex-start; padding-right: 80px; }
.msg-row.other.has-avatar { padding-left: 0; }
.msg-row.first { padding-top: 8px; }
.msg-row.last  { padding-bottom: 8px; }
.msg-avatar-gutter {
  width: 40px; flex-shrink: 0; padding: 0 6px 0 8px;
  display: flex; align-items: flex-start;
}
.msg-avatar-gutter .av { width: 26px; height: 26px; }
.bubble {
  max-width: 270px; border-radius: 16px; padding: 10px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.bubble.own   { background: var(--wire-bg-bubbles-own-primary);    color: var(--wire-content-bubbles-own-primary); }
.bubble.other { background: var(--wire-bg-bubbles-others-primary); color: var(--wire-content-base-primary); }
.msg-sender {
  font-size: 13px; font-weight: 500; line-height: 17px;
  display: flex; align-items: center; gap: 6px;
}
.msg-external {
  font-size: 11px; font-weight: 500; line-height: 12px; letter-spacing: 0.5px;
  padding: 1px 4px; border-radius: 4px;
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-secondary);
}
.msg-text { font-size: 15px; line-height: 19px; white-space: pre-wrap; word-break: break-word; }
.msg-status {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; line-height: 14px;
  color: var(--wire-content-base-secondary);
}
.bubble.own .msg-status { color: inherit; opacity: .7; }

/* Attachments — mirrors desktop's message types */
.msg-media { border-radius: 12px; overflow: hidden; display: block; width: 100%; }
.msg-media img { display: block; width: 100%; height: auto; }
.msg-media-fallback {
  width: 100%; aspect-ratio: 4 / 3; border-radius: 12px;
  background: var(--wire-bg-base-secondary);
  display: flex; align-items: center; justify-content: center;
  color: var(--wire-content-base-secondary);
}
.msg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.msg-file {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border-radius: 12px;
  background: var(--wire-bg-base-primary);
  color: var(--wire-content-base-primary);
}
.bubble.own .msg-file { background: color-mix(in srgb, #000 18%, transparent); color: var(--wire-content-bubbles-own-primary); }
.msg-file-meta { min-width: 0; }
.msg-file-name { font-size: 14px; font-weight: 500; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-file-sub  { font-size: 12px; line-height: 14px; opacity: .75; }
.msg-audio { display: flex; align-items: center; gap: 8px; }
.msg-audio-wave { flex: 1; height: 2px; border-radius: 2px; background: currentColor; opacity: .35; }
/* Reactions — spec: Android / 51618:21682. The chip strip sits under the
   bubble inside the same row and is pulled up 8dp so it tucks into the
   bubble's bottom edge (Figma models this as a -8 vertical gap). It is
   capped at the bubble width, so it wraps after about four chips. */
.msg-stack { display: flex; flex-direction: column; min-width: 0; max-width: 270px; }
.msg-row.own   .msg-stack { align-items: flex-end; }
.msg-row.other .msg-stack { align-items: flex-start; }
.msg-reactions {
  display: flex; flex-wrap: wrap; gap: 4px; row-gap: 4px;
  padding: 0 10px; margin-top: -8px; max-width: 270px;
  position: relative; z-index: 1;
}
.msg-reaction {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 4px 8px; border-radius: 12px; box-sizing: border-box;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
}
.msg-reaction .emoji { font-size: 16px; line-height: 16px; }
.msg-reaction .count {
  font-size: 12px; font-weight: 700; line-height: 14px;
  color: var(--wire-content-base-secondary);
}
.msg-reaction.own-reaction {
  background: var(--wire-bg-accent-secondary);
  border-color: var(--wire-bg-accent-primary);
}
.msg-reaction.own-reaction .count { color: var(--wire-content-accent-primary); }

/* ─── Dividers, system messages, typing ────────────────────────────*/
.msg-divider { display: flex; align-items: center; gap: 4px; padding: 16px; }
.msg-divider .rule { flex: 1; height: 1px; background: var(--wire-border-base-primary); }
.msg-divider span { font-size: 12px; font-weight: 700; line-height: 14px; color: var(--wire-content-base-primary); }
.msg-system {
  display: flex; align-items: center; gap: 16px;
  padding: 4px 16px 4px 22px;
  font-size: 15px; line-height: 19px; color: var(--wire-content-base-secondary);
}
.msg-typing-wrap { padding: 8px 16px; }
.msg-typing {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 8px 8px 4px; border-radius: 24px;
  background: var(--wire-bg-base-secondary);
  font-size: 12px; line-height: 14px; color: var(--wire-content-base-secondary);
}
.msg-typing .av { width: 16px; height: 16px; }
.msg-empty { padding: 40px 24px; text-align: center; font-size: 14px; color: var(--wire-content-base-secondary); }

/* ─── Composer (presentational) ────────────────────────────────────*/
.cv-composer {
  flex-shrink: 0; height: 56px; display: flex; align-items: center; gap: 8px;
  padding: 0 16px;
  background: var(--wire-bg-base-primary);
  border-top: 1px solid var(--wire-border-base-primary);
}
.cv-composer-input { flex: 1; font-size: 15px; line-height: 19px; color: var(--wire-content-base-secondary); }
.cv-composer-btn {
  width: 40px; height: 32px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-primary);
}

/* ═══ FILTER PILLS ══───────────────────────────────────────────────
   360x40 row, pad 4/16/8, gap 8. Pills 28dp, fully rounded, pad 4/10.
   Unselected fill in Figma is a raw iOS grey (#767680 @12%); mapped
   here to --wire-bg-base-tertiary so it themes correctly. */
.filter-bar {
  flex-shrink: 0; display: flex; gap: 8px;
  padding: 8px 16px;
  background: var(--wire-bg-base-primary);
}
.filter-pill {
  height: 28px; padding: 4px 10px; border-radius: 1000px;
  border: 1px solid transparent;
  background: var(--wire-bg-base-tertiary);
  color: var(--wire-content-base-primary);
  font: inherit; font-size: 15px; font-weight: 400; line-height: 20px;
  cursor: pointer; white-space: nowrap;
}
.filter-pill[aria-pressed="true"] {
  background: var(--wire-bg-base-primary);
  border-color: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-primary);
  font-weight: 700;
}
.list-empty {
  padding: 32px 24px; text-align: center;
  font-size: 14px; line-height: 18px;
  color: var(--wire-content-base-secondary);
}

/* ─── CONVERSATION ROW ─────────────────────────────────────────────
   Spec: Mobile UI – Android / 611:3303. 360x56, padding 0/8/0/16.
   Name row at gap 6 carries inline indicators; trailing slot at right 8. */
.conv-item {
  position: relative; height: 56px; width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 16px;
  border-bottom: 1px solid var(--wire-border-base-primary);
  background: var(--wire-bg-base-primary);
  cursor: pointer; user-select: none;
}
.conv-item:first-child { border-top: 1px solid var(--wire-border-base-primary); }
/* The conversation list closes against the surface: no rule above the
   first row or below the last one. */
#conv-list .conv-item:first-child { border-top: 0; }
#conv-list .conv-item:last-child  { border-bottom: 0; }
.conv-item:active   { background: var(--wire-bg-base-primary-focus); }
/* Kept for the tablet two-pane layout; unused on mobile, where the list
   and the conversation are separate screens. */
.conv-item.selected { background: var(--wire-bg-accent-secondary); }
.ci-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.ci-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ci-name {                                   /* Title/Title 02 — Inter at Roboto's metrics */
  font-size: 16px; font-weight: 500; line-height: 20px;
  color: var(--wire-content-base-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ci-sub {                                    /* Label/Label 04 — Inter at Roboto's metrics */
  font-size: 14px; font-weight: 400; line-height: 18px;
  color: var(--wire-content-base-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ci-trail { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* Inline name-row indicators */
.ci-legalhold { color: var(--wire-content-danger-primary);   flex-shrink: 0; }
.ci-verified  { color: var(--wire-content-positive-primary); flex-shrink: 0; }
.ci-qualifier {
  flex-shrink: 0; padding: 2px 4px; border-radius: 4px;
  font-size: 11px; font-weight: 500; line-height: 12px; letter-spacing: 0.5px;
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-secondary);
}

/* ─── EVENT BADGE ──────────────────────────────────────────────────
   Three families, all radius 6 (spec: component set 1:220). */
.ci-badge { flex-shrink: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.ci-badge.filled  { background: var(--wire-bg-inverted-primary); color: var(--wire-content-inverted-on-primary); }
.ci-badge.outline { background: var(--wire-bg-base-primary); border: 1px solid var(--wire-border-base-primary); color: var(--wire-content-base-primary); }
.ci-badge.count   { padding: 2px 8px; font-size: 12px; font-weight: 700; line-height: 14px; letter-spacing: 0.25px; }
.ci-badge.glyph   { padding: 3px 6px; }
.ci-badge.tall    { height: 18px; padding: 1px 6px; }
.ci-badge.word    { padding: 2px 8px; font-size: 11px; font-weight: 500; line-height: 12px; letter-spacing: 0.5px; color: var(--wire-content-base-primary); }
.ci-badge.danger  { color: var(--wire-content-danger-primary); }
.ci-badge.subtle  { color: var(--wire-content-base-secondary); }

/* ─── TRAILING CONTROLS ────────────────────────────────────────────*/
.ci-join {                                   /* Button/Button 03 (Inter), positive not accent */
  border: 0; padding: 8px 12px; border-radius: 12px;
  background: var(--wire-bg-positive-primary);
  color: var(--wire-content-positive-on-primary);
  font: inherit; font-size: 13px; font-weight: 500; line-height: 16px; letter-spacing: 0.3px;
  cursor: pointer;
}
.ci-audio { display: flex; flex-shrink: 0; }  /* 79x32 segmented pair */
.ci-audio button {
  width: 40px; height: 32px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-bg-base-primary);
  border: 1px solid var(--wire-border-base-primary);
  color: var(--wire-content-base-primary); cursor: pointer;
}
.ci-audio button + button { margin-left: -1px; }
.ci-check {                                   /* 18x18, radius 3, 1.5 stroke */
  width: 18px; height: 18px; border-radius: 3px; flex-shrink: 0;
  background: var(--wire-bg-base-tertiary);
  border: 1.5px solid var(--wire-content-base-secondary);
  display: flex; align-items: center; justify-content: center; color: transparent;
}
.conv-item.checked .ci-check {
  background: var(--wire-bg-accent-primary);
  border-color: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
}

/* ─── AVATARS ──────────────────────────────────────────────────────*/
.av { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
.av-person {
  width: 100%; height: 100%; border-radius: 100px;
  border: 1px solid var(--wire-border-base-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; letter-spacing: 0.3px;
  color: var(--wire-content-inverted-on-primary);
  background-size: cover; background-position: center;
}
.av-group {                                   /* 32dp, r 9.14, 1.14 border */
  width: 100%; height: 100%; border-radius: 9px;
  background: var(--wire-bg-base-primary);
  border: 1.14px solid var(--wire-border-base-primary);
  display: flex; align-items: center; justify-content: center;
}
.av-group .wds-ic { width: 22px !important; height: 11px !important; }
.av-channel {                                 /* 32dp, r 8 — Plain Colors */
  width: 100%; height: 100%; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--wire-plain-blue-secondary);
  border: 1px solid var(--wire-plain-blue-secondary-focus);
  color: var(--wire-plain-blue-primary);
}
.av-channel[data-color="purple"] { background: var(--wire-plain-purple-secondary); border-color: var(--wire-plain-purple-secondary-focus); color: var(--wire-plain-purple-primary); }
.av-channel[data-color="red"] { background: var(--wire-plain-red-secondary); border-color: var(--wire-plain-red-secondary-focus); color: var(--wire-plain-red-primary); }
.av-channel[data-color="green"] { background: var(--wire-plain-green-secondary); border-color: var(--wire-plain-green-secondary-focus); color: var(--wire-plain-green-primary); }
.av-channel[data-color="amber"] { background: var(--wire-plain-amber-secondary); border-color: var(--wire-plain-amber-secondary-focus); color: var(--wire-plain-amber-primary); }
.av-channel[data-color="petrol"] { background: var(--wire-plain-petrol-secondary); border-color: var(--wire-plain-petrol-secondary-focus); color: var(--wire-plain-petrol-primary); }
.av-channel[data-color="gray"] { background: var(--wire-plain-gray-secondary); border-color: var(--wire-plain-gray-secondary-focus); color: var(--wire-plain-gray-primary); }
.av-presence {
  position: absolute; right: -1px; bottom: -1px;
  width: 10px; height: 10px; border-radius: 100px;
  background: var(--wire-bg-positive-primary);
  box-shadow: 0 0 0 2px var(--wire-bg-base-primary);
}
.av-presence[data-status="busy"]  { background: var(--wire-bg-base-primary);
  box-shadow: inset 0 0 0 2px var(--wire-bg-danger-primary), 0 0 0 2px var(--wire-bg-base-primary); }
.av-presence[data-status="away"]  { background: var(--wire-bg-warning-primary); }
.av-presence[data-status="none"]  { display: none; }
.av-badge {
  position: absolute; right: -3px; bottom: -3px;
  width: 14px; height: 14px; border-radius: 3px;
  background: var(--wire-bg-inverted-primary);
  color: var(--wire-content-inverted-on-primary);
  display: flex; align-items: center; justify-content: center;
}

/* ─── FAB ──────────────────────────────────────────────────────────
   M3 FAB, 48dp, 16dp corner. */
.fab {
  position: absolute; right: 24px; bottom: 80px;
  width: 48px; height: 48px; border: 0; border-radius: 16px;
  background: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 3;
  box-shadow: 0 3px 6px rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.12);
}
.fab:active { background: var(--wire-bg-accent-primary-focus); }


/* ─── NAVIGATION BAR ───────────────────────────────────────────────
   M3 navigation bar, 60dp, icon-only (labels hidden per the mock). */
.nav-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  height: 60px; display: flex; align-items: center;
  padding: 0 8px;
  background: var(--wire-bg-base-primary);
  border-top: 1px solid var(--wire-border-base-primary);
}
.nav-item {
  flex: 1 0 0; min-width: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: none; border: 0; padding: 6px 0; cursor: pointer;
  color: var(--wire-content-base-secondary);
}
.nav-pill {
  width: 56px; height: 32px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s ease;
}
.nav-item[aria-selected="true"] { color: var(--wire-content-accent-on-secondary); }
.nav-item[aria-selected="true"] .nav-pill { background: var(--wire-bg-accent-secondary); }
.nav-item:active .nav-pill { background: var(--wire-bg-accent-secondary-focus); }
.nav-item[aria-selected="true"] { color: var(--wire-content-accent-primary); }

.wds-ic svg { display: block; width: 100%; height: 100%; }

/* ─── DEMO CONTROLS (prototype chrome, not part of the design) ──── */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 16px; font-size: 12px;
}
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl-label {
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  color: var(--wire-content-base-secondary); font-size: 10px;
}
.swatch {
  width: 20px; height: 20px; border-radius: 100px; cursor: pointer;
  border: 2px solid transparent; padding: 0; flex-shrink: 0;
}
.swatch.active { border-color: var(--wire-content-base-primary); }
.ctl button.chip {
  font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 100px; cursor: pointer;
  background: var(--wire-bg-base-primary); color: var(--wire-content-base-primary);
  border: 1px solid var(--wire-border-base-primary);
}
.ctl button.chip.active {
  background: var(--wire-bg-accent-primary);
  color: var(--wire-content-accent-on-primary);
  border-color: var(--wire-bg-accent-primary);
}
.caption { font-size: 11px; color: var(--wire-content-base-secondary); text-align: center; max-width: 520px; }
</style>
</head>
<body>

<div class="device">
  <div id="page" class="bg-mood-mono" data-dest="conversations">

    <!-- Band reserved for the system status bar, which the device draws -->
    <div class="status-spacer" aria-hidden="true"></div>

    <!-- M3: TopAppBar (small) -->
    <div class="title-bar" data-m3="TopAppBar">
      <div class="av tb-avatar" id="tb-avatar"></div>
      <div class="tb-title">Conversations</div>
      <button class="tb-action" id="tb-overflow" aria-label="More options"
              aria-haspopup="menu" aria-expanded="false" data-m3="IconButton"></button>
      <div class="menu" id="conv-menu" role="menu" aria-label="Group and sort conversations" data-m3="DropdownMenu"></div>
    </div>

    <!-- Everything below the title bar scrolls together -->
    <main class="app-scroll" id="list-stack">

      <!-- M3: SearchBar — expands into the full-screen search view -->
      <div class="search-bar" id="search-bar" role="search" data-m3="SearchBar"
           tabindex="0" aria-label="Search Wire">
        <span class="search-icon" id="search-icon"></span>
        <span class="search-placeholder">Search conversations</span>
        <span class="search-spacer"></span>
      </div>

      <!-- M3: Surface — opaque sheet over the wallpaper -->
      <div class="app-surface" data-m3="Surface">
        <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter conversations"></div>
        <ul class="conv-list" id="conv-list" data-m3="LazyColumn"></ul>
      </div>

    </main>

    <!-- Settings destination -->
    <div id="settings-stack">
      <div class="settings-surface">
        <ul class="settings-list" id="settings-list"></ul>
      </div>
    </div>

    <!-- M3: FloatingActionButton -->
    <button class="fab" id="fab" aria-label="New conversation" data-m3="FloatingActionButton"></button>

    <!-- M3: NavigationBar -->
    <nav class="nav-bar" id="nav-bar" data-m3="NavigationBar" role="tablist"></nav>

  </div>

  <!-- ── SETTINGS DETAIL — pushes over the settings list ── -->
  <section id="settings-detail" aria-label="Settings detail" data-m3="Screen">
    <header class="cv-header">
      <div class="cv-status-inset" aria-hidden="true"></div>
      <div class="cv-titlebar">
        <button class="cv-back" id="sd-back" aria-label="Back" data-m3="IconButton"></button>
        <span class="cv-title"><span class="cv-title-text" id="sd-title">Settings</span></span>
      </div>
    </header>
    <div class="sd-scroll"><div id="sd-body"></div></div>
  </section>

  <!-- ── CONVERSATION VIEW — pushes over the list, back returns ── -->
  <section id="conv-view" aria-label="Conversation" data-m3="Screen">
    <header class="cv-header">
      <div class="cv-status-inset" aria-hidden="true"></div>
      <div class="cv-titlebar">
        <button class="cv-back" id="cv-back" aria-label="Back" data-m3="IconButton"></button>
        <span class="cv-avatar av" id="cv-avatar"></span>
        <span class="cv-title"><span class="cv-title-text" id="cv-title">Conversation</span>
          <span class="cv-title-chevron" id="cv-chevron"></span></span>
        <button class="cv-action" aria-label="Start video call" data-m3="IconButton" id="cv-action"></button>
      </div>
    </header>
    <div class="cv-scroll" id="cv-scroll"><div id="cv-messages"></div></div>
    <div class="cv-composer" data-m3="TextField">
      <span class="cv-composer-input">Type a message</span>
      <span class="cv-composer-btn" id="cv-send"></span>
    </div>
  </section>

  <!-- ── CONVERSATION DETAILS — pushes over the conversation ── -->
  <section id="conv-details" aria-label="Conversation details" data-m3="Screen">
    <header class="cv-header">
      <div class="cv-status-inset" aria-hidden="true"></div>
      <div class="cv-titlebar">
        <button class="cv-back" id="cd-close" aria-label="Close" data-m3="IconButton"></button>
        <span class="cv-title"><span class="cv-title-text">Conversation Details</span></span>
        <button class="cv-action" id="cd-overflow" aria-label="More options" data-m3="IconButton"></button>
      </div>
    </header>
    <div class="cd-scroll" id="cd-scroll">
      <div class="cd-hero">
        <div class="av" id="cd-avatar"></div>
        <div class="cd-name" id="cd-name">Conversation name</div>
        <div class="cd-participants" id="cd-participants">0 participants</div>
      </div>
      <div class="cd-actions">
        <button class="cd-action" id="cd-search" data-m3="OutlinedButton"></button>
        <button class="cd-action" id="cd-media" data-m3="OutlinedButton"></button>
      </div>
      <div class="cd-tabs" id="cd-tabs" role="tablist" data-m3="Tabs"></div>
      <div class="cd-panel" id="cd-panel"></div>
    </div>
    <button class="fab" id="cd-fab" aria-label="Add participants"
            data-m3="FloatingActionButton"><i class="ph-bold ph-user-plus"></i></button>
  </section>

  <!-- ── GLOBAL SEARCH — full-screen M3 search view ── -->
  <section id="search-view" aria-label="Search" data-m3="SearchView">
    <header class="sv-header">
      <div class="cv-status-inset" aria-hidden="true"></div>
      <div class="sv-bar" data-m3="SearchBar">
        <button class="sv-icon-btn" id="sv-back" aria-label="Back" data-m3="IconButton"></button>
        <span class="sv-scope" id="sv-scope" style="display:none">
          <span class="sv-scope-name" id="sv-scope-name"></span>
          <button class="sv-scope-clear" id="sv-scope-clear" aria-label="Search everywhere"></button>
        </span>
        <input class="sv-input" id="sv-input" type="text" autocomplete="off"
               placeholder="Search Wire" aria-label="Search Wire"/>
        <button class="sv-icon-btn" id="sv-clear" aria-label="Clear search"
                data-m3="IconButton" style="display:none"></button>
      </div>
    </header>
    <div class="sv-chips" id="sv-chips" role="group" aria-label="Filter results" data-m3="FilterChips"></div>
    <div class="sv-results" id="sv-results" role="list" data-m3="LazyColumn"></div>
    <div class="kb" id="sv-keyboard" aria-hidden="true" data-m3="Keyboard"></div>
  </section>

    <!-- M3: system status bar — device-level, static, always on top -->
    <div class="status-bar" data-m3="SystemBars">
      <span>12:34</span>
      <span class="status-icons">
        <span class="si-sig"></span><span class="si-wifi"></span><span class="si-batt"></span>
      </span>
    </div>

</div>

   * Render an icon as an HTML string.
   * @param {string} name   registry key
   * @param {object} [opt]  { active:Boolean, size:Number (dp), cls:String }
   */

    var size = opt.size || 24;
    var entry = REGISTRY[name];
    var cls = 'wds-ic' + (opt.cls ? ' ' + opt.cls : '');
    var box = 'display:inline-flex;align-items:center;justify-content:center;'
            + 'width:' + size + 'px;height:' + size + 'px;flex-shrink:0;';
    if (!entry) {
      return '<span class="' + cls + '" style="' + box + '" data-icon="' + name + '"></span>';
    }
    if (entry.svg) {
      var glyph = opt.active ? entry.svg.active : entry.svg.inactive;
      return '<span class="' + cls + '" style="' + box + '" data-icon="' + name + '">' + glyph + '</span>';

<script>
(function () {
  'use strict';

  var root = document.documentElement;
  var page = document.getElementById('page');

  /* ── Background moods — same set the desktop prototype exposes ── */
  var MOODS   = ['vibrant', 'balanced', 'calm', 'solid', 'mono'];
  /* Same five the desktop prototype offers, in the same order.
     Petrol and Red exist as tokens but are not offered on either
     platform, so they stay out of the picker. */
  var ACCENTS = ['blue', 'green', 'amber', 'purple', 'ink'];
  var currentMood = 'mono';   /* desktop default */

  /* Chrome contrast over the wallpaper — mirrors railFor() on desktop.
     Gradient moods track the theme; the solid variant is always dark. */
  function applyChrome() {
    var isDark = root.getAttribute('data-theme') === 'dark';
    var onDark = (currentMood === 'solid') || isDark;
    /* On the root so the device-level status bar inherits it too. */
    root.style.setProperty('--chrome-fg', onDark ? '#ffffff' : '#000000');
  }

  function applyMood(mood) {
    currentMood = mood;
    MOODS.forEach(function (m) { page.classList.remove('bg-mood-' + m); });
    page.classList.add('bg-mood-' + mood);
    document.querySelectorAll('[data-mood-set]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.moodSet === mood);
    });
    applyChrome();
  }

  function setAccent(a) {
    if (a === 'blue') root.removeAttribute('data-accent');
    else root.setAttribute('data-accent', a);
    document.querySelectorAll('[data-accent-set]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.accentSet === a);
    });
    applyChrome();
  }

  /* Theme follows the browser's colour-scheme preference until the
     person picks one in Settings, after which their choice sticks.
     The desktop prototype seeds from the same media query on load. */
  var themeIsUserChoice = false;
  function systemTheme() {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }
  function watchSystemTheme() {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function () { if (!themeIsUserChoice) setTheme(systemTheme()); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

    root.setAttribute('data-theme', t);

    });
    applyChrome();
  }

  function badge(type, count) {
    function glyph(name, cls, size) {
      return '<span class="ci-badge ' + cls + '">' + WDS.icon(name, { size: size || 12 }) + '</span>';
    }
    switch (type) {
      case 'unread':        return '<span class="ci-badge filled count">' + (count || 1) + '</span>';
      case 'mention':       return glyph('mention',    'filled glyph');
      case 'reply':         return glyph('reply',      'filled glyph');
      case 'missedcall':    return glyph('missedcall', 'filled glyph');
      case 'thread':        return glyph('thread',     'filled glyph');
      case 'ping':          return glyph('ping',       'filled glyph');
      case 'request':       return glyph('pending12',  'filled glyph');
      case 'muted':         return glyph('mute',       'outline glyph');
      case 'muted-mention': return glyph('mention',    'filled glyph');
      case 'muted-reply':   return glyph('reply',      'filled glyph');
      case 'attention':     return glyph('attention',  'outline tall danger', 14);
      case 'onboarding':    return glyph('pending14',  'outline tall subtle', 14);
      case 'pending':       return '<span class="ci-badge outline word">pending</span>';
      default:              return '';

    if (c.state === 'multiselect') {

  function bindAccentDropdown() {
    var field = document.getElementById('accent-dd-field');
    var menu  = document.getElementById('accent-dd-menu');
    if (!field || !menu) return;
    field.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.classList.toggle('open');
      field.setAttribute('aria-expanded', open);
    });
    menu.addEventListener('click', function (e) {
      var opt = e.target.closest('.sd-dd-opt');
      if (!opt) return;
      menu.classList.remove('open');
      field.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', function () {
      menu.classList.remove('open');
      field.setAttribute('aria-expanded', 'false');
    });
  }

    document.getElementById('sd-title').textContent = label;
    document.getElementById('sd-body').innerHTML = appearanceHtml();

  /* The in-app controls and the demo bar under the phone drive the same
     state, so whichever you touch, both stay in step. */
  function syncAppearanceControls() {
    var theme = root.getAttribute('data-theme');
    var accent = root.getAttribute('data-accent') || 'blue';
    document.querySelectorAll('[data-theme-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.themeSet === theme);
      b.classList.toggle('active', b.dataset.themeSet === theme);
    });
    document.querySelectorAll('[data-accent-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.accentSet === accent);
      b.classList.toggle('active', b.dataset.accentSet === accent);
    });
    document.querySelectorAll('[data-mood-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.moodSet === currentMood);
      b.classList.toggle('active', b.dataset.moodSet === currentMood);
    });
    var prev = document.getElementById('prev-list');
    if (prev) {
      MOODS.forEach(function (m) { prev.classList.remove('bg-mood-' + m); });
      prev.classList.add('bg-mood-' + currentMood);
    }
    var sw = document.getElementById('accent-dd-swatch');
    var lb = document.getElementById('accent-dd-label');
    if (sw) sw.style.background = accentSwatchStyle(accent);
    if (lb) lb.textContent = ACCENT_LABELS[accent];
    document.querySelectorAll('.sd-dd-opt').forEach(function (o) {
      o.setAttribute('aria-selected', o.dataset.accentSet === accent);
    });
  }

    document.getElementById('sd-back').innerHTML = WDS.icon('back', { size: 16 });
    document.getElementById('sd-back').addEventListener('click', closeSetting);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSetting(); });

  var DAY_MS = 86400000;
  function dayLabel(n) {
    if (n === 0) return 'Today';
    if (n === 1) return 'Yesterday';
    var d = new Date(Date.now() - n * DAY_MS);
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  /* Same rule as desktop and as the Figma spec: consecutive messages
     from one sender sharing a timestamp form one run. */
  function groupMessages(msgs) {
    var runs = [];
    msgs.forEach(function (m) {
      var last = runs[runs.length - 1];
      if (last && last.sender === m.sender && last.time === m.time) last.bubbles.push(m);
      else runs.push({ sender: m.sender, time: m.time, bubbles: [m] });
    });
    return runs;
  }

  function mediaHtml(src) {
    return '<span class="msg-media"><img src="' + src + '" alt="" '
         + 'onerror="this.parentNode.outerHTML=\'<span class=&quot;msg-media-fallback&quot;>Image</span>\'"></span>';
  }

  function bodyHtml(m) {
    var out = '';
    if (m.text) out += '<span class="msg-text">' + m.text + '</span>';
    if (m.type === 'image' || m.type === 'image-solo' || m.type === 'image-with-text' || m.type === 'video-solo') {
      if (m.src) out += mediaHtml(m.src);
    }
    if (m.type === 'media-grid' && m.media) {
      out += '<span class="msg-grid">' + m.media.map(function (x) { return mediaHtml(x.src); }).join('') + '</span>';
    }
    if (m.type === 'file-solo' || m.type === 'file-with-text') {
      out += '<span class="msg-file">' + WDS.icon('drive', { size: 20 })
           + '<span class="msg-file-meta"><span class="msg-file-name">' + (m.filename || 'File') + '</span>'
           + '<span class="msg-file-sub">' + [m.filetype, m.filesize].filter(Boolean).join(' \u00b7 ') + '</span></span></span>';
    }
    if (m.type === 'audio') {
      out += '<span class="msg-audio">' + WDS.icon('meetings', { size: 16 })
           + '<span class="msg-audio-wave"></span><span class="msg-file-sub">' + (m.duration || '0:12') + '</span></span>';
    }
    return out;
  }

  function reactionsHtml(m) {
    if (!m.reactions || !m.reactions.length) return '';
    return '<div class="msg-reactions">' + m.reactions.map(function (r) {
      return '<span class="msg-reaction' + (r.own ? ' own-reaction' : '') + '">'
           + '<span class="emoji">' + r.emoji + '</span>'
           + '<span class="count">' + r.count + '</span></span>';
    }).join('') + '</div>';
  }

  function renderThread(key, isGroupConv) {
    var host = document.getElementById('cv-messages');
    var msgs = THREADS[key];
    if (!msgs || !msgs.length) {
      host.innerHTML = '<div class="msg-empty">No messages yet.</div>';
      return;
    }
    var html = '', buffer = [];

    function flush() {
      if (!buffer.length) return;
      groupMessages(buffer).forEach(function (run) {
        var own = run.sender === 'self';
        var showAvatar = isGroupConv && !own;
        run.bubbles.forEach(function (m, i) {
          var first = i === 0, last = i === run.bubbles.length - 1;
          var cls = 'msg-row ' + (own ? 'own' : 'other')
                  + (showAvatar ? ' has-avatar' : '')
                  + (first ? ' first' : '') + (last ? ' last' : '');
          var gutter = showAvatar
            ? '<span class="msg-avatar-gutter">' + (first
                ? '<span class="av">' + personAvatar({ initials: m.initials, color: m.color }) + '</span>' : '') + '</span>'
            : '';
          var sender = (showAvatar && first)
            ? '<span class="msg-sender" style="color:var(--wire-identity-' + (m.color || 'blue') + ')">' + m.sender
              + (m.external ? '<span class="msg-external">External</span>' : '') + '</span>'
            : '';
          var status = last
            ? '<span class="msg-status">' + run.time
              + (own ? WDS.icon('delivered', { size: 13 }) : '') + '</span>'
            : '';
          html += '<div class="' + cls + '">' + gutter
                + '<div class="msg-stack">'
                +   '<div class="bubble ' + (own ? 'own' : 'other') + '">'
                +     sender + bodyHtml(m) + status
                +   '</div>'
                +   reactionsHtml(m)
                + '</div></div>';
        });
      });
      buffer = [];
    }

    msgs.forEach(function (m) {
      if (m.divider) {
        flush();
        html += '<div class="msg-divider"><span class="rule"></span><span>'
             + (m.divider === 'day' ? dayLabel(m.day) : m.time)
             + '</span><span class="rule"></span></div>';
      } else if (m.type === 'system') {
        flush();
        html += '<div class="msg-system">' + WDS.icon('attention', { size: 14 }) + '<span>' + m.text + '</span></div>';
      } else {
        buffer.push(m);
      }
    });
    flush();
    host.innerHTML = html;
  }
